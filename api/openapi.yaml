      summary: Acknowledge an attention item without resolving it
      responses: {'200': {description: Acknowledged notification, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/logs/operational:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: from, in: query, description: "Inclusive RFC3339Nano timestamp lower bound; invalid values are silently ignored by the handler.", schema: {type: string, format: date-time}}, {name: to, in: query, description: "Inclusive RFC3339Nano timestamp upper bound; invalid values are silently ignored by the handler.", schema: {type: string, format: date-time}}, {name: severity, in: query, description: "Payload text filter for a severity string; matching uses SQL LIKE against serialized JSON rather than a normalized severity column.", schema: {type: string}}, {name: component, in: query, description: "Event type prefix filter matching type values shaped as component dot suffix.", schema: {type: string}}, {name: request_id, in: query, description: "Payload text filter for request_id using SQL LIKE; it is not parsed as exact JSON equality.", schema: {type: string}}, {name: agent_id, in: query, description: "Payload text filter for agent_id using SQL LIKE; it is not parsed as exact JSON equality.", schema: {type: string}}, {name: session_id, in: query, description: "Payload text filter for session_id using SQL LIKE; it is not parsed as exact JSON equality.", schema: {type: string}}, {name: proposal_id, in: query, description: "Payload text filter for proposal_id using SQL LIKE; it is not parsed as exact JSON equality.", schema: {type: string}}, {name: transaction_id, in: query, description: "Payload text filter for transaction_id using SQL LIKE; it is not parsed as exact JSON equality.", schema: {type: string}}, {name: cursor, in: query, description: "Positive decimal global event ID; returns older rows with IDs less than the cursor.", schema: {type: string}}, {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listOperationalLogs
      summary: Search bounded redacted operational logs
      responses: {'200': {description: Operational logs, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalLogs'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/audit:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: from, in: query, description: "Inclusive RFC3339Nano timestamp lower bound; invalid values are silently ignored by the handler.", schema: {type: string, format: date-time}}, {name: to, in: query, description: "Inclusive RFC3339Nano timestamp upper bound; invalid values are silently ignored by the handler.", schema: {type: string, format: date-time}}, {name: actor, in: query, description: "Exact stored actor ID filter; the returned actor value is text-redacted.", schema: {type: string}}, {name: action, in: query, description: "Exact stored action name filter.", schema: {type: string}}, {name: request_id, in: query, description: "Exact stored request ID filter.", schema: {type: string}}, {name: entity_id, in: query, description: "Exact stored entity ID filter.", schema: {type: string}}, {name: cursor, in: query, description: "Positive decimal audit row ID; returns older rows with IDs less than the cursor.", schema: {type: string}}, {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listAuditEvents
      summary: List immutable audit events
      responses: {'200': {description: Audit events, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEvents'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/audit/export:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: format, in: query, description: "Output encoding: json, ndjson, or csv. The handler lowercases the value; missing or unrecognized values fall back to JSON.", schema: {type: string, enum: [json, ndjson, csv], default: json}}, {$ref: '#/components/parameters/ActorID'}]
    get:
      operationId: exportAuditEvents
      summary: Export a bounded redacted audit slice
      description: Exports are capped at 1000 rows and the export itself is recorded as an audit event.
      responses: {'200': {description: JSON, NDJSON, or CSV audit export}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/settings:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getEffectiveSettings
      summary: Return effective workspace configuration and source metadata
      description: Returns all six known sections. Each section starts from built-in defaults; only the most recently written revision's section is overlaid on those defaults, so earlier overrides in a different section are not merged by the current loader. Secret-like keys are represented only as configured booleans in this response.
      responses: {'200': {description: Effective settings, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveSettings'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/settings/schema:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getSettingsSchema
      summary: Return section and field configuration schema
      description: Returns the built-in field defaults, inferred JSON types, secret-key flags, and restart_required marker. The current schema has six sections and does not validate most supplied values against these inferred types.
      responses: {'200': {description: Settings schema, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsSchema'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/settings/preflight:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}]
    post:
      operationId: preflightSettingsUpdate
      summary: Validate settings and calculate impact before update
      description: Requires X-Actor-ID. Validates a section and values object, then returns allowed=true and a deterministic confirmation token tied to workspace, section, and current version. Only governance quorum currently receives a field-level range check; preflight does not reserve the version or persist a change.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsPreflightInput'}}}}
      responses: {'200': {description: Settings impact and confirmation token, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsPreflight'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/settings/{section}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: section, in: path, required: true, schema: {type: string, enum: [general, governance, adapters, mcp, storage, notifications]}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/IfMatch'}, {name: X-Confirmation-Token, in: header, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
    patch:
      operationId: updateSettingsSection
      summary: Update one configuration section with optimistic concurrency
      description: Requires X-Actor-ID and an expected version supplied by If-Match or expected_version. A mismatch returns 409. Governance updates additionally require the current X-Confirmation-Token returned by preflight; other sections do not enforce the token even though preflight returns one. Values are not checked against the schema's inferred field types, unknown keys are accepted, and the response sanitizes secret-like keys. Each successful request writes a new configuration revision, audit event, and workspace event.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsUpdate'}}}}
      responses: {'200': {description: Updated effective settings, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveSettings'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/transactions/{transaction_id}/{action}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: transaction_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [stage, validate, apply, cancel, retry, compensate]}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: transitionTransaction
      summary: Control a transaction through the transaction manager
      description: All mutations require a human role. Apply additionally requires the internal orchestrator header and is the only route that invokes repository mutation; agents and browser clients cannot write the repository directly.
      responses: {'200': {description: Transaction operation result, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listClaims
      summary: List workspace resource claims
      responses: {'200': {description: Claims, content: {application/json: {schema: {$ref: '#/components/schemas/Claims'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/internal:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
