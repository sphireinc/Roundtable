openapi: 3.1.0
info:
  title: Roundtable API
  version: v1
  description: Local-first governed control-plane API.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Lightweight process health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Control-plane status
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeHealthResponse'}
  /api/v1/workspaces/{id}/health:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getWorkspaceHealth
      summary: Lightweight workspace health summary
      responses:
        '200':
          description: Workspace health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceHealthResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List registered workspaces
      responses:
        '200':
          description: Workspace collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
                  next_cursor: {type: [string, 'null']}
        '500': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createWorkspace
      summary: Register a workspace without mutating its repository
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceInput'}
      responses:
        '201':
          description: Workspace registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getWorkspace
      summary: Get a registered workspace
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateWorkspace
      summary: Update workspace metadata
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspacePatch'}
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: detachWorkspace
      summary: Detach metadata without deleting the repository
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
      responses:
        '200':
          description: Detached workspace and impact report
          content:
            application/json:
              schema:
                type: object
                required: [workspace, impact]
                properties:
                  workspace: {$ref: '#/components/schemas/Workspace'}
                  impact: {$ref: '#/components/schemas/WorkspaceImpact'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRepositoryStatus
      summary: Get repository status without exposing filesystem paths
      responses:
        '200':
          description: Repository status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryStatus'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/branch-switch/preflight:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post:
      operationId: preflightRepositoryBranchSwitch
      summary: Check blockers before a governed branch switch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchSwitchInput'}
      responses:
        '200':
          description: Branch switch preflight
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BranchSwitchPreflight'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/branch-switch:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
    post:
      operationId: switchRepositoryBranch
      summary: Switch a workspace branch through the governed transaction boundary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchSwitchInput'}
      responses:
        '200':
          description: Branch switched
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BranchSwitchResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/entities:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: q
        in: query
        schema: {type: string}
      - name: type
        in: query
        schema: {type: string, enum: [file, directory, symbol, schema, endpoint, command, test_suite]}
      - name: path
        in: query
        schema: {type: string}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    get:
      operationId: listRepositoryEntities
      summary: Search and paginate the read-only repository entity index
      responses:
        '200':
          description: Repository entities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryEntities'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/entities/{entity_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: entity_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRepositoryEntity
      summary: Get one indexed repository entity and governance context
      responses:
        '200':
          description: Repository entity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryEntity'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    get:
      operationId: listAgents
      summary: List redacted agent registry entries
      responses:
        '200':
          description: Agent registry
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Agent'}}
                  next_cursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: agent_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getAgent
      summary: Get one redacted agent registry entry
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/enable:
    post:
      operationId: enableAgent
      summary: Enable an agent
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent enabled, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/disable:
    post:
      operationId: disableAgent
      summary: Disable an agent using drain semantics
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/diagnostics:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: agent_id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: runAgentDiagnostics
      summary: Run bounded, read-only adapter and MCP diagnostics
      responses:
        '202':
          description: Diagnostic completed or accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listSessions
      summary: List sessions for a workspace
      responses:
        '200': {description: Sessions, content: {application/json: {schema: {$ref: '#/components/schemas/Sessions'}}}}
    post:
      operationId: createSession
      summary: Create and start a governed agent session
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionInput'}}}
      responses:
        '201': {description: Session started, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Get a session
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: session_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions/{session_id}/pause:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post: {operationId: pauseSession, summary: Pause a session, responses: {'200': {description: Paused, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/resume:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post: {operationId: resumeSession, summary: Resume a compatible session, responses: {'200': {description: Resuming, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/stop:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post: {operationId: stopSession, summary: Gracefully stop a session, responses: {'200': {description: Stopped, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/terminate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: terminateSession
      summary: Terminate a session with impact confirmation
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionTerminationInput'}}}
      responses: {'200': {description: Terminated, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/heartbeat:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [starting, active, running, paused, resuming]}}
    post: {operationId: heartbeatSession, summary: Report session heartbeat, responses: {'200': {description: Heartbeat accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/logs:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    get:
      operationId: listSessionLogs
      summary: List redacted session event logs
      responses: {'200': {description: Session logs, content: {application/json: {schema: {$ref: '#/components/schemas/SessionLogs'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/tool-calls:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    get:
      operationId: listSessionToolCalls
      summary: List user-visible MCP tool and action records
      responses: {'200': {description: Tool calls, content: {application/json: {schema: {$ref: '#/components/schemas/SessionToolCalls'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/claims:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listSessionClaims
      summary: List current and historical claims for the session agent
      responses: {'200': {description: Claims, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedClaims'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/proposals:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listSessionProposals
      summary: List proposal references for the session agent
      responses: {'200': {description: Proposals, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedSessionProposals'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/metrics:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getSessionMetrics
      summary: Get adapter-supplied usage metrics
      responses: {'200': {description: Session metrics, content: {application/json: {schema: {$ref: '#/components/schemas/SessionMetrics'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/environment:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getSessionEnvironment
      summary: Get safe environment fingerprint metadata
      responses: {'200': {description: Environment fingerprint, content: {application/json: {schema: {$ref: '#/components/schemas/SessionEnvironment'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listDeliberations
      summary: List workspace deliberations
      parameters: [{name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
      responses: {'200': {description: Deliberations, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberations'}}}}, '404': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createDeliberation
      summary: Create a governed deliberation
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliberationInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getDeliberation
      summary: Get a deliberation
      responses: {'200': {description: Deliberation, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/{action}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [start, pause, resume, terminate]}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: transitionDeliberation
      summary: Transition a deliberation lifecycle state
      responses: {'200': {description: Updated deliberation, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/messages:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}]
    post:
      operationId: addDeliberationMessage
      summary: Append governed human input
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliberationMessageInput'}}}}
      responses: {'201': {description: Message appended}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/transcript:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listDeliberationTranscript
      summary: List the immutable user-visible deliberation transcript and events
      responses: {'200': {description: Transcript, content: {application/json: {schema: {$ref: '#/components/schemas/TranscriptEntries'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/transcript/{entry_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}, {name: entry_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getDeliberationTranscriptEntry
      summary: Deep-link to one transcript entry
      responses: {'200': {description: Transcript entry, content: {application/json: {schema: {$ref: '#/components/schemas/TranscriptEntry'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listProposals
      summary: List workspace-scoped proposals
      responses: {'200': {description: Proposals, content: {application/json: {schema: {$ref: '#/components/schemas/Proposals'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/internal:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: createInternalProposal
      summary: Create a proposal through the orchestrator boundary
      parameters: [{name: X-Roundtable-Orchestrator, in: header, required: true, schema: {type: string, enum: ['true']}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProposalInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getProposal
      summary: Get a workspace-scoped proposal
      responses: {'200': {description: Proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/{action}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [request-review, reject, withdraw]}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: transitionProposal
      summary: Transition a proposal through a governed state change
      responses: {'200': {description: Updated proposal, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/patch:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getPatchMetadata
      summary: Get immutable patch metadata and stale-base status
      responses: {'200': {description: Patch metadata, content: {application/json: {schema: {$ref: '#/components/schemas/PatchMetadata'}}}}, '400': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/patch/files:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listPatchFiles
      summary: List files touched by an immutable patch
      responses: {'200': {description: Patch files, content: {application/json: {schema: {$ref: '#/components/schemas/PatchFiles'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/patch/diff:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listPatchDiffChunks
      summary: List redacted unified diff lines
      responses: {'200': {description: Diff lines, content: {application/json: {schema: {$ref: '#/components/schemas/PatchDiff'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/patch/symbol-impact:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listPatchSymbolImpact
      summary: List symbols impacted by an immutable patch
      responses: {'200': {description: Symbol impact, content: {application/json: {schema: {$ref: '#/components/schemas/PatchSymbols'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/proposals/{proposal_id}/validation:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: proposal_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: rerunProposalValidation
      summary: Rerun safe proposal validation stages without repository mutation
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationInput'}}}}
      responses: {'202': {description: Validation run, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationRun'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listClaims
      summary: List workspace resource claims
      responses: {'200': {description: Claims, content: {application/json: {schema: {$ref: '#/components/schemas/Claims'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/internal:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: createInternalClaim
      summary: Acquire a claim through the orchestrator boundary
      parameters: [{name: X-Roundtable-Orchestrator, in: header, required: true, schema: {type: string, enum: ['true']}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/{claim_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: claim_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getClaim
      summary: Get one workspace resource claim
      responses: {'200': {description: Claim, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/{claim_id}/{action}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: claim_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [extend, release, force-release]}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: transitionClaim
      summary: Extend or release a claim
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimExtendInput'}}}}
      responses: {'200': {description: Updated claim, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/contentions:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: resource_id, in: query, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listClaimContentions
      summary: List persisted claim contention records
      responses: {'200': {description: Claim contentions, content: {application/json: {schema: {$ref: '#/components/schemas/Contentions'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/claims/contentions/{contention_id}/resolve:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: contention_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: resolveClaimContention
      summary: Resolve a claim contention with human authorization
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContentionResolutionInput'}}}}
      responses: {'200': {description: Resolved contention, content: {application/json: {schema: {$ref: '#/components/schemas/ContentionResolution'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  parameters:
    ActorID:
      name: X-Actor-ID
      in: header
      required: true
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected workspace revision for optimistic concurrency control.
      schema: {type: integer, minimum: 1}
    ActorRole:
      name: X-Actor-Role
      in: header
      required: true
      schema: {type: string, enum: [human, admin, chair]}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    ComponentHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, ok, degraded, unavailable, unknown, active, detached]}
        details: {type: object, additionalProperties: true}
    NodeHealthResponse:
      type: object
      required: [status, version, api_version, time, request_id, components]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        api_version: {type: string, enum: [v1]}
        time: {type: string, format: date-time}
        request_id: {type: string}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentHealth'}}
        degraded_reasons: {type: array, items: {type: string}}
    WorkspaceHealthResponse:
      type: object
      required: [workspace, status, components, impact, request_id]
      properties:
        workspace: {$ref: '#/components/schemas/Workspace'}
        status: {type: string, enum: [ok, degraded]}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentHealth'}}
        impact: {$ref: '#/components/schemas/WorkspaceImpact'}
        degraded_reasons: {type: array, items: {type: string}}
        request_id: {type: string}
    WorkspaceInput:
      type: object
      required: [root_path]
      properties:
        display_name: {type: string}
        root_alias: {type: string}
        root_path: {type: string}
        default_branch: {type: string}
    WorkspacePatch:
      type: object
      minProperties: 1
      properties:
        display_name: {type: string}
        root_alias: {type: string}
        default_branch: {type: string}
    Workspace:
      type: object
      required: [id, display_name, canonical_repository_identity, status, created_at]
      properties:
        id: {type: string}
        revision: {type: integer, minimum: 1}
        display_name: {type: string}
        root_alias: {type: string}
        canonical_repository_identity: {type: string}
        status: {type: string, enum: [active, detached]}
        default_branch: {type: string}
        created_at: {type: string, format: date-time}
        last_opened_at: {type: string, format: date-time}
    WorkspaceImpact:
      type: object
      required: [active_sessions, active_claims, open_proposals, active_transactions]
      properties:
        active_sessions: {type: integer}
        active_claims: {type: integer}
        open_proposals: {type: integer}
        active_transactions: {type: integer}
    RepositoryChange:
      type: object
      required: [path, index, worktree]
      properties:
        path: {type: string}
        index: {type: string, minLength: 1, maxLength: 1}
        worktree: {type: string, minLength: 1, maxLength: 1}
    RepositoryRemote:
      type: object
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string}
    ProtectedPathSummary:
      type: object
      required: [changed]
      properties:
        changed: {type: integer, minimum: 0}
        paths: {type: array, items: {type: string}}
    RepositoryStatus:
      type: object
      required: [workspace_id, branch, head_sha, dirty, ahead, behind, detached, remotes, index, protected_paths]
      properties:
        workspace_id: {type: string}
        root_alias: {type: string}
        branch: {type: string}
        head_sha: {type: string}
        dirty: {type: boolean}
        ahead: {type: integer, minimum: 0}
        behind: {type: integer, minimum: 0}
        detached: {type: boolean}
        remotes: {type: array, items: {$ref: '#/components/schemas/RepositoryRemote'}}
        index: {type: array, items: {$ref: '#/components/schemas/RepositoryChange'}}
        protected_paths: {$ref: '#/components/schemas/ProtectedPathSummary'}
    BranchSwitchInput:
      type: object
      required: [branch]
      additionalProperties: false
      properties:
        branch: {type: string, minLength: 1}
    RepositoryBlocker:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        count: {type: integer, minimum: 0}
    BranchSwitchPreflight:
      type: object
      required: [workspace_id, target_branch, allowed, blockers, repository]
      properties:
        workspace_id: {type: string}
        target_branch: {type: string}
        allowed: {type: boolean}
        blockers: {type: array, items: {$ref: '#/components/schemas/RepositoryBlocker'}}
        repository: {$ref: '#/components/schemas/RepositoryStatus'}
    BranchSwitchResponse:
      type: object
      required: [workspace, before, after]
      properties:
        workspace: {$ref: '#/components/schemas/Workspace'}
        before: {$ref: '#/components/schemas/RepositoryStatus'}
        after: {$ref: '#/components/schemas/RepositoryStatus'}
    RepositoryEntity:
      type: object
      required: [id, type, path]
      properties:
        id: {type: string}
        type: {type: string}
        path: {type: string}
        name: {type: string}
        language: {type: string}
        kind: {type: string}
        start_line: {type: integer, minimum: 0}
        end_line: {type: integer, minimum: 0}
        claim_status: {type: string}
        related_proposals: {type: array, items: {type: string}}
        related_entities: {type: array, items: {type: string}}
    RepositoryEntities:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RepositoryEntity'}}
        next_cursor: {type: [string, 'null']}
    Agent:
      type: object
      required: [agent_id, display_name, adapter_type, enabled, health, capabilities, supports_resume, supports_mcp, concurrency_limit, policy_weight, active_session_count]
      properties:
        agent_id: {type: string}
        display_name: {type: string}
        adapter_type: {type: string}
        enabled: {type: boolean}
        health: {type: string}
        executable_version: {type: string}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        supports_resume: {type: boolean}
        supports_mcp: {type: boolean}
        concurrency_limit: {type: integer, minimum: 1}
        policy_weight: {type: integer, minimum: 0}
        active_session_count: {type: integer, minimum: 0}
        last_heartbeat: {type: string, format: date-time}
    DiagnosticCheck:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        status: {type: string, enum: [passed, failed]}
        detail: {type: string}
    DiagnosticRun:
      type: object
      required: [run_id, agent_id, started_at, finished_at, status, checks]
      properties:
        run_id: {type: string}
        agent_id: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        status: {type: string, enum: [passed, failed]}
        checks: {type: array, items: {$ref: '#/components/schemas/DiagnosticCheck'}}
        stdout: {type: string}
        stderr: {type: string}
        remediation_hints: {type: array, items: {type: string}}
    SessionInput:
      type: object
      required: [agent_id, run_id, adapter]
      additionalProperties: false
      properties:
        agent_id: {type: string}
        run_id: {type: string}
        adapter: {type: string}
        provider: {type: string}
        model: {type: string}
        external_session_id: {type: string}
    Session:
      type: object
      required: [id, agent_id, run_id, adapter, status, started_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        run_id: {type: string}
        adapter: {type: string}
        provider: {type: string}
        model: {type: string}
        external_session_id: {type: string}
        resume_command_template: {type: string}
        status: {type: string, enum: [starting, active, running, paused, resuming, stopped, terminated]}
        started_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
    Sessions:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Session'}}
        next_cursor: {type: [string, 'null']}
    SessionTerminationInput:
      type: object
      additionalProperties: false
      properties:
        impact_details: {type: string}
    SessionLog:
      type: object
      required: [id, event_type, created_at]
      properties:
        id: {type: integer}
        event_type: {type: string}
        payload: {type: string}
        created_at: {type: string, format: date-time}
    SessionLogs:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionLog'}}
        next_cursor: {type: [string, 'null']}
    SessionToolCall:
      type: object
      required: [id, tool, created_at]
      properties:
        id: {type: integer}
        tool: {type: string}
        action: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
    SessionToolCalls:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionToolCall'}}
        next_cursor: {type: [string, 'null']}
    PaginatedClaims:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: [string, 'null']}
    PaginatedSessionProposals:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: [string, 'null']}
    SessionMetrics:
      type: object
      required: [session_id, usage, source]
      properties:
        session_id: {type: string}
        usage: {type: object, additionalProperties: {type: number}}
        source: {type: string}
    SessionEnvironment:
      type: object
      required: [session_id, fingerprint]
      properties:
        session_id: {type: string}
        fingerprint: {type: object, additionalProperties: {type: string}}
    DeliberationInput:
      type: object
      required: [goal, agent_pool]
      additionalProperties: false
      properties:
        goal: {type: string}
        agent_pool: {type: array, minItems: 1, items: {type: string}}
        governance_profile: {type: string}
        initial_resource_scope: {type: array, items: {type: string}}
        budget_limit: {type: integer, minimum: 0}
        time_limit_seconds: {type: integer, minimum: 0}
        human_constraints: {type: array, items: {type: string}}
        moderator_id: {type: string}
    Deliberation:
      type: object
      required: [id, workspace_id, goal, status, created_by, agent_pool, participants, round, unresolved_conflicts, linked_proposals, created_at, updated_at]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        goal: {type: string}
        status: {type: string, enum: [draft, running, paused, terminated]}
        created_by: {type: string}
        moderator_id: {type: string}
        agent_pool: {type: array, items: {type: string}}
        participants: {type: array, items: {type: string}}
        governance_profile: {type: string}
        initial_resource_scope: {type: array, items: {type: string}}
        budget_limit: {type: integer}
        time_limit_seconds: {type: integer}
        human_constraints: {type: array, items: {type: string}}
        round: {type: integer, minimum: 0}
        unresolved_conflicts: {type: array, items: {type: string}}
        linked_proposals: {type: array, items: {type: string}}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Deliberations:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deliberation'}}
        next_cursor: {type: [string, 'null']}
    DeliberationMessageInput:
      type: object
      required: [body]
      properties:
        message_type: {type: string, default: human_instruction}
        body: {type: string}
    TranscriptEntry:
      type: object
      required: [id, round, actor, kind, visibility_class, rendering, created_at]
      properties:
        id: {type: string}
        round: {type: integer, minimum: 0}
        actor: {type: string}
        kind: {type: string, enum: [message, event]}
        message_type: {type: string}
        summary: {type: string}
        content: {type: string}
        tool_references: {type: array, items: {type: string}}
        claim_references: {type: array, items: {type: string}}
        proposal_references: {type: array, items: {type: string}}
        vote_references: {type: array, items: {type: string}}
        visibility_class: {type: string, enum: [user_visible, operational]}
        rendering: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    TranscriptEntries:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TranscriptEntry'}}
        next_cursor: {type: [string, 'null']}
    ProposalInput:
      type: object
      required: [title, summary, patch_path]
      additionalProperties: false
      properties:
        proposal_id: {type: string}
        deliberation_id: {type: string}
        proposer_session_id: {type: string}
        title: {type: string}
        summary: {type: string}
        patch_path: {type: string}
        base_revision: {type: string}
        risk: {type: string, enum: [normal, high]}
        resource_ids: {type: array, items: {type: string}}
    Proposal:
      type: object
      required: [proposal_id, workspace_id, title, summary, patch_path, state, vote_state, policy_state, approval_state, transaction_state, risk, created_at, updated_at]
      properties:
        proposal_id: {type: string}
        workspace_id: {type: string}
        deliberation_id: {type: string}
        proposer_session_id: {type: string}
        title: {type: string}
        summary: {type: string}
        patch_path: {type: string}
        base_revision: {type: string}
        state: {type: string, enum: [pending, in_review, accepted, rejected, withdrawn]}
        vote_state: {type: string}
        policy_state: {type: string}
        approval_state: {type: string}
        transaction_state: {type: string}
        risk: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Proposals:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Proposal'}}
        next_cursor: {type: [string, 'null']}
    PatchMetadata:
      type: object
      required: [proposal_id, patch_path, current_head, stale_base, file_count, added_lines, removed_lines, binary_files]
      properties:
        proposal_id: {type: string}
        patch_path: {type: string}
        base_revision: {type: string}
        current_head: {type: string}
        stale_base: {type: boolean}
        file_count: {type: integer, minimum: 0}
        added_lines: {type: integer, minimum: 0}
        removed_lines: {type: integer, minimum: 0}
        binary_files: {type: integer, minimum: 0}
    PatchFile:
      type: object
      required: [path, operation, binary]
      properties:
        path: {type: string}
        old_path: {type: string}
        new_path: {type: string}
        operation: {type: string, enum: [create, modify, delete, rename]}
        binary: {type: boolean}
        added_lines: {type: integer}
        removed_lines: {type: integer}
    PatchFiles:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatchFile'}}
        next_cursor: {type: [string, 'null']}
    PatchDiff:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: string}}
        next_cursor: {type: [string, 'null']}
    PatchSymbol:
      type: object
      required: [path, resource_id, kind, name, start_line, end_line]
      properties:
        path: {type: string}
        resource_id: {type: string}
        kind: {type: string}
        name: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
    PatchSymbols:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatchSymbol'}}
        next_cursor: {type: [string, 'null']}
    ValidationInput:
      type: object
      additionalProperties: false
      properties:
        stages: {type: array, items: {type: string, enum: [patch_parse, apply_dry_run, static_checks, tests, policy, stale_base]}}
    ValidationRun:
      type: object
      required: [run_id, proposal_id, status, started_at, completed_at, stages, commands]
      properties:
        run_id: {type: string}
        proposal_id: {type: string}
