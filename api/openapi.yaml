      summary: Resolve a claim contention with human authorization
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContentionResolutionInput'}}}}
      responses: {'200': {description: Resolved contention, content: {application/json: {schema: {$ref: '#/components/schemas/ContentionResolution'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    HumanBearer:
      type: http
      scheme: bearer
      bearerFormat: local-human-token
      description: Optional local-first bearer token for browser/admin requests. Store outside source control.
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: local-agent-token
      description: Separate token for agent/MCP control surfaces. Never expose it to browser code.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, capped at 200.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema: {type: string}
    Sort:
      name: sort
      in: query
      required: false
      description: Endpoint-specific allowlisted sort field.
      schema: {type: string}
    Direction:
      name: direction
      in: query
      required: false
      schema: {type: string, enum: [asc, desc], default: desc}
    ActorID:
      name: X-Actor-ID
      in: header
      required: true
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected workspace revision for optimistic concurrency control.
      schema: {type: integer, minimum: 1}
    ActorRole:
      name: X-Actor-Role
      in: header
      required: true
      schema: {type: string, enum: [human, view, operate, approve, govern, administer, force-override]}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    SecurityCapabilities:
      type: object
      required: [authentication, agent_boundary, csrf, default_bind, roles]
      properties:
        authentication: {type: string, enum: [local-header-development, bearer-token], description: "Configured authentication mode; reports whether either shared bearer token is present, not whether a credential is valid or strong."}
        agent_boundary: {type: string, description: "Human-readable summary of the advertised separation between agent and browser credentials; descriptive only and not an authorization decision."}
        csrf: {type: string, description: "Human-readable summary of the state-changing Origin check; does not indicate that a separate CSRF token is enforced."}
        default_bind: {type: string, example: 127.0.0.1, description: "Documented default listener address; this is not the actual bound address or proxy exposure."}
        roles: {type: array, items: {type: string, enum: [view, operate, approve, govern, administer, force-override]}, description: "Role labels advertised by capability discovery; handlers do not uniformly enforce a centralized role hierarchy."}
        allowed_origins: {type: array, items: {type: string, format: uri}, description: "Configured browser origins accepted by the HTTP server; presence does not establish WebSocket origin enforcement."}
    MaintenanceStatus:
      type: object
      required: [foreign_keys, wal, protected_immutable_tables]
      properties:
        foreign_keys: {type: boolean, description: "Whether SQLite foreign-key enforcement is enabled on the inspected database connection."}
        wal: {type: boolean, description: "Whether the database reports WAL journal mode."}
        protected_immutable_tables: {type: array, items: {type: string}, description: "Table names excluded from the retention cleanup operation; this is not a complete immutability guarantee for every API or database writer."}
    RetentionInput:
      type: object
      required: [retention_days]
      properties:
        retention_days: {type: integer, minimum: 1, maximum: 3650, description: "Age threshold in calendar days; the retention endpoint deletes notifications older than the computed UTC cutoff."}
    ComponentHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, ok, degraded, unavailable, unknown, active, detached], description: "Component health or workspace state reported by the current projection; interpretation depends on the component and may not represent process liveness."}
        details: {type: object, additionalProperties: true, description: "Optional component-specific diagnostic values; keys and value shapes vary by component."}
    NodeHealthResponse:
      type: object
      required: [status, version, api_version, time, request_id, components]
      properties:
        status: {type: string, enum: [ok, degraded], description: "Aggregate node status; degraded means at least one inspected database or adapter condition is reported degraded or unavailable."}
        version: {type: string, description: "Configured API build/version metadata; defaults to dev when not set."}
        api_version: {type: string, enum: [v1], description: "API route contract version, independent of the build version."}
        time: {type: string, format: date-time, description: "UTC timestamp when this health projection was assembled."}
        request_id: {type: string, description: "Request correlation identifier assigned to this HTTP response."}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentHealth'}, description: "Named node subsystem health projections; ready labels do not prove provider subprocess liveness."}
        degraded_reasons: {type: array, items: {type: string}, description: "Human-readable reasons contributing to aggregate degraded status; omitted when no reasons were recorded."}
    WorkspaceHealthResponse:
      type: object
      required: [workspace, status, components, impact, request_id]
      properties:
        workspace: {$ref: '#/components/schemas/Workspace', description: "Workspace record used to scope this health view."}
        status: {type: string, enum: [ok, degraded], description: "Aggregate status combining node health with whether the selected workspace is detached."}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentHealth'}, description: "Node component reports plus the selected workspace component state."}
        impact: {$ref: '#/components/schemas/WorkspaceImpact', description: "Counts of selected workspace records considered by the impact projection; not a complete activity or safety assessment."}
        degraded_reasons: {type: array, items: {type: string}, description: "Human-readable reasons contributing to degraded status; omitted when no reasons were recorded."}
        request_id: {type: string, description: "Request correlation identifier assigned to this HTTP response."}
    WorkspaceInput:
      type: object
      required: [root_path]
      properties:
        display_name: {type: string, description: "Human-readable workspace label; when blank during creation, the API derives it from the validated root directory name."}
        root_alias: {type: string, description: "Optional short operator-facing alias for the registered root; it does not change filesystem resolution."}
        root_path: {type: string, description: "Filesystem directory to register as the workspace root; the server validates and canonicalizes it against its allowed-root configuration."}
        default_branch: {type: string, description: "Optional recorded default-branch metadata; setting it does not switch the repository or verify the branch exists."}
    WorkspacePatch:
      type: object
      minProperties: 1
      properties:
        display_name: {type: string, description: "Replacement display label when the supplied value is nonblank; an empty value leaves the stored label unchanged."}
        root_alias: {type: string, description: "Replacement operator-facing alias when nonblank; an empty value leaves the stored alias unchanged."}
        default_branch: {type: string, description: "Replacement default-branch metadata when nonblank; does not switch the repository's current branch."}
    Workspace:
      type: object
      required: [id, display_name, canonical_repository_identity, status, created_at]
      properties:
        id: {type: string, description: "Stable identifier assigned when the workspace is registered."}
        revision: {type: integer, minimum: 1, description: "Monotonic workspace revision used by conditional updates such as If-Match; it is not a repository commit number."}
        display_name: {type: string, description: "Human-readable workspace label."}
        root_alias: {type: string, description: "Optional short alias for display and operator selection."}
        canonical_repository_identity: {type: string, description: "SHA-256 identifier derived from the canonical filesystem root path; moving the checkout can change this identity, and it is not derived from a Git remote URL."}
        status: {type: string, enum: [active, detached], description: "Registry lifecycle state; detached means the workspace is no longer available for normal active workspace operations."}
        default_branch: {type: string, description: "Recorded default-branch metadata; does not imply the repository is currently checked out on this branch."}
        created_at: {type: string, format: date-time, description: "Workspace registration timestamp in RFC3339 date-time form."}
        last_opened_at: {type: string, format: date-time, description: "Timestamp set at workspace creation and update by the current handlers; ordinary reads do not refresh it, and it is omitted when not recorded."}
    WorkspaceImpact:
      type: object
      required: [active_sessions, active_claims, open_proposals, active_transactions]
      properties:
        active_sessions: {type: integer, description: "Count of workspace sessions whose status is exactly active or running; not a subprocess liveness probe."}
        active_claims: {type: integer, description: "Count of workspace claims with exact active status; expiry is not equivalent to a claim being transitioned out of active status."}
        open_proposals: {type: integer, description: "Count of workspace proposals with exact pending or in_review status; other statuses are excluded."}
        active_transactions: {type: integer, description: "Count of workspace transactions with exact pending or running status."}
    RepositoryChange:
      type: object
      required: [path, index, worktree]
      properties:
        path: {type: string, description: "Repository-relative path reported by Git status; rename records use the destination path parsed by the handler."}
        index: {type: string, minLength: 1, maxLength: 1, description: "Single-character Git index status code for the staged side of this path."}
        worktree: {type: string, minLength: 1, maxLength: 1, description: "Single-character Git worktree status code for the unstaged side of this path."}
    RepositoryRemote:
      type: object
      required: [name, url]
      properties:
        name: {type: string, description: "Git remote name in the inspected repository."}
        url: {type: string, description: "Remote URL reported by Git; may contain sensitive host or repository information."}
    ProtectedPathSummary:
      type: object
      required: [changed]
      properties:
        changed: {type: integer, minimum: 0, description: "Number of changed paths matching the API's protected-path prefixes (.roundtable, .github, and TASKS.ROUNDTABLE)."}
        paths: {type: array, items: {type: string}, description: "Repository-relative changed paths counted as protected; omitted when no such paths were found."}
    RepositoryStatus:
      type: object
      required: [workspace_id, branch, head_sha, dirty, ahead, behind, detached, remotes, index, protected_paths]
      properties:
        workspace_id: {type: string, description: "Identifier of the workspace whose registered repository was inspected."}
        root_alias: {type: string, description: "Optional display alias copied from the workspace registry."}
        branch: {type: string, description: "Current branch name, or literal HEAD when Git reports detached HEAD."}
        head_sha: {type: string, description: "Full object ID of the current HEAD commit."}
        dirty: {type: boolean, description: "Whether Git porcelain status reported any staged or worktree changes."}
        ahead: {type: integer, minimum: 0, description: "Commit count by which HEAD is ahead of its configured upstream; zero when detached or when upstream comparison fails."}
        behind: {type: integer, minimum: 0, description: "Commit count by which HEAD is behind its configured upstream; zero when detached or when upstream comparison fails."}
        detached: {type: boolean, description: "Whether the repository HEAD is detached."}
        remotes: {type: array, items: {$ref: '#/components/schemas/RepositoryRemote'}, description: "Configured Git remotes, with duplicate fetch/push entries collapsed by remote name."}
        index: {type: array, items: {$ref: '#/components/schemas/RepositoryChange'}, description: "Per-path index and worktree status codes from Git porcelain output."}
        protected_paths: {$ref: '#/components/schemas/ProtectedPathSummary', description: "Summary of changed paths under the API's protected-path prefixes."}
    BranchSwitchInput:
      type: object
      required: [branch]
      additionalProperties: false
      properties:
        branch: {type: string, minLength: 1, description: "Target local branch name for preflight or switch; handler rejects unsafe path-like, option-like, empty, or newline-containing values."}
    RepositoryBlocker:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: "Stable machine-readable reason this preflight condition blocks a switch."}
        message: {type: string, description: "Human-readable summary of the blocking repository or workspace condition."}
        count: {type: integer, minimum: 0, description: "Count associated with a record-based blocker; omitted when the blocker is boolean or does not expose a count."}
    BranchSwitchPreflight:
      type: object
      required: [workspace_id, target_branch, allowed, blockers, repository]
      properties:
        workspace_id: {type: string, description: "Workspace whose repository and governance state were checked."}
        target_branch: {type: string, description: "Validated target branch name considered by this preflight."}
        allowed: {type: boolean, description: "True only when the current preflight produced no dirty-worktree, active-transaction, active-claim, open-proposal, active-session, or already-on-branch blocker."}
        blockers: {type: array, items: {$ref: '#/components/schemas/RepositoryBlocker'}, description: "Current reasons that prevent switching; this is a point-in-time assessment and must be recomputed before mutation."}
        repository: {$ref: '#/components/schemas/RepositoryStatus', description: "Repository state inspected during this preflight."}
    BranchSwitchResponse:
      type: object
      required: [workspace, before, after]
      properties:
        workspace: {$ref: '#/components/schemas/Workspace', description: "Updated workspace registry record after the branch switch was recorded."}
        before: {$ref: '#/components/schemas/RepositoryStatus', description: "Repository status captured immediately before the switch."}
        after: {$ref: '#/components/schemas/RepositoryStatus', description: "Repository status inspected after the switch completed."}
    RepositoryEntity:
      type: object
      required: [id, type, path]
      properties:
        id: {type: string, description: "Stable entity identifier, generally derived from the entity category and repository path or symbol identity."}
        type: {type: string, description: "Repository entity category used by the discovery projection."}
        path: {type: string, description: "Repository-relative path associated with the entity."}
        name: {type: string, description: "Entity name when a symbol or named repository artifact is available."}
        language: {type: string, description: "Detected source language for entities backed by recognized source files."}
        kind: {type: string, description: "Parser/indexer classification for a discovered symbol; absent when the entity is not a symbol."}
        start_line: {type: integer, minimum: 0, description: "One-based starting line for a discovered symbol when available; zero can indicate no indexed span."}
        end_line: {type: integer, minimum: 0, description: "One-based ending line for a discovered symbol when available; zero can indicate no indexed span."}
        claim_status: {type: string, description: "Claim status associated with this entity when a matching resource record exists."}
        related_proposals: {type: array, items: {type: string}, description: "Proposal identifiers linked to this repository entity by the API projection."}
        related_entities: {type: array, items: {type: string}, description: "Identifiers of other entities linked by the current repository discovery projection."}
    RepositoryEntities:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RepositoryEntity'}, description: "Repository entities returned for the requested workspace and page."}
        next_cursor: {type: [string, 'null'], description: "Opaque continuation cursor for the next page, or null when no further page is available."}
    Agent:
      type: object
      required: [agent_id, display_name, adapter_type, enabled, health, capabilities, supports_resume, supports_mcp, concurrency_limit, policy_weight, active_session_count]
      properties:
        agent_id: {type: string, description: "Identifier of the global agent registry row returned through the workspace-scoped API route."}
        display_name: {type: string, description: "Configured display name stored on the agent record."}
        adapter_type: {type: string, description: "Adapter name stored on the agent record; capability fields below are currently projected by exact built-in name checks."}
        enabled: {type: boolean, description: "Persisted agent enablement flag; does not prove that an external process is running."}
        health: {type: string, description: "Stored agent status, with an empty value projected as unknown; not an executable or heartbeat probe."}
        executable_version: {type: string, description: "Optional executable version field; the current agent response projection does not populate it."}
        capabilities: {type: object, additionalProperties: {type: boolean}, description: "Capability labels currently derived from exact adapter-name cases, not dynamically inspected from configured adapter metadata or enforced as OS restrictions."}
        supports_resume: {type: boolean, description: "Hardcoded response capability: true for codex, claude, and gemini; false for other adapter names, regardless of custom configuration."}
        supports_mcp: {type: boolean, description: "Hardcoded response capability: true for codex, claude, gemini, and opencode; false for other adapter names."}
        concurrency_limit: {type: integer, minimum: 1, description: "Advertised as 1 by the current handler; this response value does not enforce session scheduling or process concurrency."}
        policy_weight: {type: integer, minimum: 0, description: "Advertised as 1 by the current handler; this is not a dynamically loaded policy weight or enforced scheduling limit."}
        active_session_count: {type: integer, minimum: 0, description: "Global count of this agent's sessions whose stored status is exactly active or running; it is not workspace-filtered or checked against process liveness."}
        last_heartbeat: {type: string, format: date-time, description: "Optional heartbeat timestamp; not populated by the current agent response projection."}
    DiagnosticCheck:
      type: object
      required: [name, status]
      properties:
        name: {type: string, description: "Diagnostic check identifier, such as executable_version, mcp_surface, or read_only_boundary."}
        status: {type: string, enum: [passed, failed], description: "Outcome of this individual probe; a passed informational check is not proof of provider process execution."}
        detail: {type: string, description: "Optional probe result or sanitized failure summary; omitted when the check has no detail."}
    DiagnosticRun:
      type: object
      required: [run_id, agent_id, started_at, finished_at, status, checks]
      properties:
        run_id: {type: string, description: "Timestamp-derived diagnostic record ID; it is stored as a test-run ID and is not the coordinator run ID."}
        agent_id: {type: string, description: "Global agent registry identifier probed by this diagnostic request."}
        started_at: {type: string, format: date-time, description: "UTC timestamp captured immediately before running the diagnostic checks."}
        finished_at: {type: string, format: date-time, description: "UTC timestamp captured after the checks complete."}
        status: {type: string, enum: [passed, failed], description: "Aggregate diagnostic outcome; failed if any individual check reports failed."}
        checks: {type: array, items: {$ref: '#/components/schemas/DiagnosticCheck'}, description: "Results for the adapter version executable probe, MCP registry visibility check, and declared read-only boundary."}
        stdout: {type: string, description: "Optional bounded excerpt of combined adapter version-probe output after limited line-based secret filtering."}
        stderr: {type: string, description: "Optional standard-error field; the current diagnostic implementation does not populate it."}
        remediation_hints: {type: array, items: {type: string}, description: "Fixed suggested follow-up text; hints are not a complete diagnosis or proof that the suggested remediation is appropriate."}
    SessionInput:
      type: object
      required: [agent_id, run_id, adapter]
      additionalProperties: false
      properties:
        agent_id: {type: string, description: "Existing global agent identifier to associate with the created session."}
        run_id: {type: string, description: "Caller-supplied run identifier stored on the session; the handler does not verify that the run belongs to this workspace."}
        adapter: {type: string, description: "Caller-supplied adapter label; it is not checked against the agent's configured adapter or launched as a process."}
        provider: {type: string, description: "Optional provider label retained as session metadata; does not select or invoke a provider executable."}
        model: {type: string, description: "Optional model label retained as session metadata; does not verify model availability."}
        external_session_id: {type: string, description: "Optional external CLI session identifier supplied by the caller; not discovered by this endpoint."}
    Session:
      type: object
      required: [id, agent_id, run_id, adapter, status, started_at]
      properties:
        id: {type: string, description: "Timestamp-derived session identifier assigned by the API; it is not the external provider session ID."}
        agent_id: {type: string, description: "Global agent registry identifier associated with this session."}
        run_id: {type: string, description: "Run identifier copied from the creation request; not independently resolved or verified against workspace membership."}
        adapter: {type: string, description: "Adapter label copied from the creation request; no CLI process is launched."}
        provider: {type: string, description: "Optional provider metadata copied from the request; omitted when empty."}
        model: {type: string, description: "Optional model metadata copied from the request; omitted when empty."}
        external_session_id: {type: string, description: "Optional externally managed session identifier; omitted when none was supplied."}
        resume_command_template: {type: string, description: "Generic `<adapter> resume <external_session_id>` display template; not taken from adapter configuration and not executed by the API."}
        status: {type: string, enum: [starting, active, running, paused, resuming, stopped, terminated], description: "Persisted session lifecycle label; state transitions are control-plane records and do not themselves start, pause, resume, or kill a process."}
        started_at: {type: string, format: date-time, description: "Session creation timestamp in UTC RFC3339Nano form."}
        last_seen_at: {type: string, format: date-time, description: "Most recent stored session activity/heartbeat timestamp; does not establish process liveness."}
        ended_at: {type: string, format: date-time, description: "Stored end timestamp when a transition sets one; omitted when absent."}
    Sessions:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Session'}, description: "Workspace-associated session rows returned for this page."}
        next_cursor: {type: [string, 'null'], description: "Opaque base64url-encoded offset cursor for the next page, or null when no further page is available."}
    SessionTerminationInput:
      type: object
      additionalProperties: false
      properties:
        impact_details: {type: string, description: "Optional human-supplied impact acknowledgment; termination requires nonblank text when the agent has active claims, but the handler does not persist or analyze this text."}
    SessionLog:
      type: object
      required: [id, event_type, created_at]
      properties:
        id: {type: integer, format: int64, description: "Persisted agent-session event row identifier."}
        event_type: {type: string, description: "Stored session event category."}
        payload: {type: string, description: "Redacted JSON payload serialized as text; omitted when empty."}
        created_at: {type: string, format: date-time, description: "Stored event creation timestamp."}
    SessionLogs:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionLog'}, description: "Session event rows for the resolved session, in repository-provided order before offset pagination."}
        next_cursor: {type: [string, 'null'], description: "Base64url-encoded decimal offset for the next page, or null when exhausted."}
    SessionToolCall:
      type: object
      required: [id, tool, created_at]
      properties:
        id: {type: integer, format: int64, description: "Global workspace event row ID; gaps are possible because the event table is shared."}
        tool: {type: string, description: "Redacted tool label from payload.tool or the event type suffix."}
        action: {type: string, description: "Optional redacted action label from the event payload."}
        status: {type: string, description: "Optional redacted status label from the event payload."}
        created_at: {type: string, format: date-time, description: "Underlying workspace event creation timestamp."}
    SessionToolCalls:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionToolCall'}, description: "Filtered tool/action events associated with the session's run; this is a projection and can include matching event payloads not produced by a successful external tool invocation."}
        next_cursor: {type: [string, 'null'], description: "Base64url-encoded decimal offset for the next page, or null when exhausted."}
    PaginatedClaims:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: [string, 'null']}
    PaginatedSessionProposals:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: [string, 'null']}
    SessionMetrics:
      type: object
      required: [session_id, usage, source]
      properties:
        session_id: {type: string}
        usage: {type: object, additionalProperties: {type: number}}
        source: {type: string}
    SessionEnvironment:
      type: object
      required: [session_id, fingerprint]
      properties:
        session_id: {type: string}
        fingerprint: {type: object, additionalProperties: {type: string}}
    DeliberationInput:
      type: object
      required: [goal, agent_pool]
      additionalProperties: false
      properties:
        goal: {type: string, description: "Required deliberation goal; trimmed and stored as the deliberation title and metadata goal."}
        agent_pool: {type: array, minItems: 1, items: {type: string}, description: "Required nonempty list of existing global agent IDs; values are trimmed and persisted as participant rows, without checking enablement or launching agents."}
        governance_profile: {type: string, description: "Optional profile label retained in deliberation metadata; this endpoint does not itself load or enforce the named policy profile."}
        initial_resource_scope: {type: array, items: {type: string}, description: "Optional resource identifiers retained as deliberation metadata; not a filesystem permission boundary."}
        budget_limit: {type: integer, minimum: 0, description: "Optional nonnegative budget metadata; persistence does not enforce spending or token limits."}
        time_limit_seconds: {type: integer, minimum: 0, description: "Optional nonnegative time-limit metadata; persistence does not schedule automatic timeout or termination."}
        human_constraints: {type: array, items: {type: string}, description: "Optional human-provided constraints retained in metadata; this endpoint does not independently evaluate compliance."}
        moderator_id: {type: string, description: "Optional moderator label stored with the deliberation; it is not authenticated or launched as an agent."}
    Deliberation:
      type: object
      required: [id, workspace_id, goal, status, created_by, agent_pool, participants, round, unresolved_conflicts, linked_proposals, created_at, updated_at]
      properties:
        id: {type: string, description: "Timestamp-derived deliberation identifier; the record is workspace-scoped."}
        workspace_id: {type: string, description: "Workspace registry identifier that scopes reads and lifecycle changes for this deliberation."}
        goal: {type: string, description: "Trimmed goal text stored as the deliberation title and returned as its goal."}
        status: {type: string, enum: [draft, running, paused, terminated], description: "Persisted control-plane lifecycle state; it does not prove that agents are executing or enforce budget/time metadata."}
        created_by: {type: string, description: "Actor ID attributed to the creation request; it is caller-supplied identity metadata."}
        moderator_id: {type: string, description: "Optional moderator label from creation metadata; omitted when empty and not proof of an active moderator process."}
        agent_pool: {type: array, items: {type: string}, description: "Agent IDs projected from the deliberation participant rows; currently the same set as participants."}
        participants: {type: array, items: {type: string}, description: "Persisted participant agent IDs, returned in sorted order; participation does not launch or authenticate agents."}
        governance_profile: {type: string, description: "Optional profile label recovered from metadata; omitted when absent and not evidence that the profile was applied."}
        initial_resource_scope: {type: array, items: {type: string}, description: "Optional resource identifiers recovered from metadata; omitted when absent and not an access-control boundary."}
        budget_limit: {type: integer, description: "Optional budget value recovered from metadata; zero may be omitted and no spend enforcement is implied."}
        time_limit_seconds: {type: integer, description: "Optional time limit recovered from metadata; zero may be omitted and no automatic timeout is implemented by this record."}
        human_constraints: {type: array, items: {type: string}, description: "Optional constraint strings recovered from metadata with text redaction; omitted when absent."}
        round: {type: integer, minimum: 0, description: "Maximum round number stored for this deliberation, defaulting to zero; it is not a count of completed discussions."}
        unresolved_conflicts: {type: array, items: {type: string}, description: "Summaries of conflicts whose stored status is exactly open, in creation order, with text redaction applied."}
        linked_proposals: {type: array, items: {type: string}, description: "Proposal identifiers associated with this deliberation; the current response reader does not populate this field, so it may serialize as null/empty despite being required by the schema."}
        started_at: {type: string, format: date-time, description: "Timestamp set on the first transition into running; subsequent resumes preserve the original start time."}
        ended_at: {type: string, format: date-time, description: "Timestamp set when the deliberation is terminated; omitted before termination."}
        created_at: {type: string, format: date-time, description: "UTC timestamp recorded when the deliberation row was created."}
        updated_at: {type: string, format: date-time, description: "UTC timestamp last written by a lifecycle transition."}
    Deliberations:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deliberation'}, description: "Workspace deliberations ordered by creation time and ID before in-memory pagination."}
        next_cursor: {type: [string, 'null'], description: "Opaque base64url-encoded offset cursor for the next page, or null when no further page is available."}
    DeliberationMessageInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        message_type: {type: string, default: human_instruction, description: "Optional message category; an empty or omitted value becomes human_instruction, while other nonempty labels are stored without enum validation."}
        body: {type: string, description: "Required nonblank message content; the handler applies text redaction before persisting and returning it."}
    TranscriptEntry:
      type: object
      required: [id, round, actor, kind, visibility_class, rendering, created_at]
      properties:
        id: {type: string, description: "Source-prefixed message:<id> or event:<numeric-id>; the detail endpoint also accepts the unprefixed source ID."}
        round: {type: integer, minimum: 0, description: "Current deliberation round copied onto every projected transcript row, not a historical per-entry round lookup."}
        actor: {type: string, description: "Redacted actor label from the message or event record."}
        kind: {type: string, enum: [message, event], description: "Source record category: human/agent deliberation message or operational event."}
        message_type: {type: string, description: "Redacted message category for message entries; omitted for event entries."}
        summary: {type: string, description: "Redacted event type for operational event entries; omitted for message entries."}
        content: {type: string, description: "Redacted message body for message entries; operational event payloads are not exposed as transcript content."}
        tool_references: {type: array, items: {type: string}, description: "References heuristically extracted from selected string fields in an event JSON payload; not a complete tool-call trace."}
        claim_references: {type: array, items: {type: string}, description: "Claim references heuristically extracted from event payload claim/claim_id string fields."}
        proposal_references: {type: array, items: {type: string}, description: "Proposal references heuristically extracted from event payload proposal/proposal_id string fields."}
        vote_references: {type: array, items: {type: string}, description: "Vote references heuristically extracted from event payload vote/vote_id string fields."}
        visibility_class: {type: string, enum: [user_visible, operational], description: "Fixed projection label: messages are user_visible and event records are operational; it is not a complete authorization or redaction policy."}
        rendering: {type: object, additionalProperties: true, description: "Fixed rendering hints currently declaring Markdown format, HTML disallowed, and links untrusted."}
        created_at: {type: string, format: date-time, description: "Source record creation timestamp used to merge messages and events into transcript order."}
    TranscriptEntries:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TranscriptEntry'}, description: "Merged message and operational-event transcript entries sorted by creation time, then entry ID."}
        next_cursor: {type: [string, 'null'], description: "Opaque base64url-encoded offset cursor for the next page, or null when no further page is available."}
    ProposalInput:
      type: object
      required: [title, summary, patch_path]
      additionalProperties: false
      properties:
        proposal_id: {type: string, description: "Optional caller-supplied proposal identifier; when empty the server generates a timestamp-based ID. Repeating the same request with its idempotency key replays the middleware-cached response; a conflicting identifier can still fail at persistence."}
        deliberation_id: {type: string, description: "Optional deliberation association stored as supplied; creation does not verify that a corresponding deliberation exists."}
        proposer_session_id: {type: string, description: "Optional session identifier recorded as proposal provenance; creation does not validate that the session exists."}
        title: {type: string, description: "Required nonblank proposal title; surrounding whitespace is trimmed and the returned value is text-redacted."}
        summary: {type: string, description: "Required nonblank proposal summary; redaction is applied before persistence and again when read."}
        patch_path: {type: string, description: "Required repository-relative patch artifact path. Creation rejects absolute paths and any path containing '..'; patch reads apply workspace-root containment checks."}
        base_revision: {type: string, description: "Optional repository revision the proposed patch is based on; stored as evidence and compared with current HEAD by patch metadata, not enforced during proposal creation."}
        risk: {type: string, enum: [normal, high], description: "Proposal risk label; omission defaults to normal. The handler stores other supplied strings without validating the documented enum."}
        resource_ids: {type: array, items: {type: string}, description: "Optional resource identifiers associated with the proposal in the same database transaction; referenced resources are not validated here."}
    Proposal:
      type: object
      required: [proposal_id, workspace_id, title, summary, patch_path, state, vote_state, policy_state, approval_state, transaction_state, risk, created_at, updated_at]
      properties:
        proposal_id: {type: string, description: "Stable proposal identifier assigned on creation or supplied by the caller."}
        workspace_id: {type: string, description: "Workspace that owns the proposal; reads are scoped to this workspace."}
        deliberation_id: {type: string, description: "Optional recorded deliberation association; empty values are omitted from JSON."}
        proposer_session_id: {type: string, description: "Optional recorded proposer session; empty values are omitted from JSON."}
        title: {type: string, description: "Proposal title after text redaction on read."}
        summary: {type: string, description: "Proposal summary after text redaction on read."}
        patch_path: {type: string, description: "Workspace-relative patch artifact path after text redaction on read."}
        base_revision: {type: string, description: "Optional revision recorded as the patch base; empty values are omitted."}
        state: {type: string, enum: [pending, in_review, accepted, rejected, withdrawn], description: "Lifecycle state stored on the proposal; supported human actions move pending to in_review, rejected, or withdrawn, and in_review to rejected or withdrawn."}
        vote_state: {type: string, description: "Stored vote projection state, defaulting to pending when the database value is null; this read field is not recalculated as part of proposal retrieval."}
        policy_state: {type: string, description: "Stored policy projection state, defaulting to pending when the database value is null."}
        approval_state: {type: string, description: "Stored approval projection state, defaulting to pending when the database value is null."}
        transaction_state: {type: string, description: "Stored transaction projection state, defaulting to not_started when the database value is null."}
        risk: {type: string, description: "Risk label persisted at creation; the current handler defaults omission to normal but does not validate the input against the documented values."}
        created_at: {type: string, format: date-time, description: "Proposal creation timestamp returned from its stored record."}
        updated_at: {type: string, format: date-time, description: "Most recent lifecycle update timestamp, falling back to created_at when the stored update value is null."}
    Proposals:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Proposal'}, description: "Proposals owned by the selected workspace, ordered by creation time and ID before pagination."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next response page, or null when no further page is available."}
    PatchMetadata:
      type: object
      required: [proposal_id, patch_path, current_head, stale_base, file_count, added_lines, removed_lines, binary_files]
      properties:
        proposal_id: {type: string, description: "Proposal whose patch artifact was loaded."}
        patch_path: {type: string, description: "Stored workspace-relative path used to read the patch artifact."}
        base_revision: {type: string, description: "Recorded base revision; omitted when empty."}
        current_head: {type: string, description: "HEAD revision observed from repository inspection; inspection errors are ignored and can therefore produce an empty value."}
        stale_base: {type: boolean, description: "True only when a nonempty recorded base revision differs from the observed HEAD; this is an informational comparison, not a freshness guarantee."}
        file_count: {type: integer, minimum: 0, description: "Number of unique touched file paths parsed from the patch."}
        added_lines: {type: integer, minimum: 0, description: "Current parser projection counts parsed change ranges (hunk headers), not individual added lines; treat as approximate metadata."}
        removed_lines: {type: integer, minimum: 0, description: "Current projection increments once per deleted file, not once per removed line; it is not a removed-line total."}
        binary_files: {type: integer, minimum: 0, description: "Reserved binary-file count; the current metadata handler leaves this at zero."}
    PatchFile:
      type: object
      required: [path, operation, binary]
      properties:
        path: {type: string, description: "Primary file path, using the new path when present and otherwise the old path."}
        old_path: {type: string, description: "Old path from the parsed patch header; omitted when absent."}
        new_path: {type: string, description: "New path from the parsed patch header; omitted when absent."}
        operation: {type: string, enum: [create, modify, delete, rename], description: "Operation inferred from parsed new, deleted, and rename header flags; otherwise reported as modify."}
        binary: {type: boolean, description: "Whether the raw patch contains a matching conventional 'Binary files a/... b/...' marker; this is a textual heuristic."}
        added_lines: {type: integer, description: "Currently returned as zero; per-file added-line counts are not populated by this handler."}
        removed_lines: {type: integer, description: "Currently returned as zero; per-file removed-line counts are not populated by this handler."}
    PatchFiles:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatchFile'}, description: "File-change headers parsed from the patch artifact; patch application or semantic validity is not established by this listing."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next response page, or null when no further page is available."}
    PatchDiff:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: string}, description: "Redacted patch text split into newline-delimited strings; pagination is applied to those lines."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next response page, or null when no further page is available."}
    PatchSymbol:
      type: object
      required: [path, resource_id, kind, name, start_line, end_line]
      properties:
        path: {type: string, description: "Indexed workspace path for the symbol, limited to currently existing files touched by the patch."}
        resource_id: {type: string, description: "Resource identifier produced by the symbol indexer for this symbol."}
        kind: {type: string, description: "Language/indexer-specific symbol kind."}
        name: {type: string, description: "Symbol name reported by the indexer."}
        start_line: {type: integer, description: "One-based start line from indexing the current workspace file, not a projected post-patch location."}
        end_line: {type: integer, description: "One-based end line from indexing the current workspace file, not a projected post-patch location."}
    PatchSymbols:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatchSymbol'}, description: "Symbols discovered in current workspace contents of parsed touched files; unsafe paths and indexing failures are skipped, and proposed patch contents are not indexed."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next response page, or null when no further page is available."}
    ValidationInput:
      type: object
      additionalProperties: false
      description: Selects safe proposal validation stages. Omission or an empty list runs patch_parse, apply_dry_run, policy, and stale_base; static_checks and tests run only when explicitly selected. Unknown stage names return 400.
      properties:
        stages: {type: array, items: {type: string, enum: [patch_parse, apply_dry_run, static_checks, tests, policy, stale_base]}, description: "Optional ordered list of validation stages. patch_parse checks patch existence/parsing; apply_dry_run tests temporary application; static_checks runs git diff --check; tests runs go test ./...; policy checks governance; stale_base compares the proposal base to current HEAD. The current handler does not deduplicate repeated stages."}
    ValidationRun:
      type: object
      required: [run_id, proposal_id, status, started_at, completed_at, stages, commands]
      description: Synchronous validation result returned with HTTP 202 after the checks and persistence have completed. Commands run with a 30-second timeout and captured output is capped at 8 KiB per command; stage failures produce status failed.
      properties:
        run_id: {type: string, description: "Generated validation run ID based on its start timestamp."}
        proposal_id: {type: string, description: "Proposal validated within the selected workspace."}
        status: {type: string, enum: [passed, failed], description: "Overall outcome; failed when core patch validation errors or any selected stage reports passed=false."}
        started_at: {type: string, format: date-time, description: "UTC start time in RFC3339Nano form."}
        completed_at: {type: string, format: date-time, description: "UTC completion time in RFC3339Nano form."}
        stages: {type: object, additionalProperties: true, description: "Map keyed by requested stage name to stage-specific result objects; selected stages are evaluated after core PatchValidate succeeds."}
        commands: {type: object, additionalProperties: {type: string}, description: "Reserved command summary map; currently returned empty even when static_checks or tests run."}
        output: {type: string, description: "Optional redacted core validation error text; omitted when core validation succeeds. Stage command output is instead included in the corresponding stage result."}
    ClaimInput:
      type: object
      required: [agent_id, task_id, resource_type, mode]
      additionalProperties: false
      properties:
        claim_id: {type: string, description: "Optional claim identifier; omission generates a timestamp-based claim ID."}
        agent_id: {type: string, description: "Required nonblank agent identity recorded as the claim owner."}
        session_id: {type: string, description: "Accepted by the request decoder but currently not passed to claim persistence or returned by the handler."}
        task_id: {type: string, description: "Required nonblank task identifier associated with the claim."}
        resource_id: {type: string, description: "Optional explicit resource key. If omitted, the service derives one from resource_type and path, or from resource_type and symbol for symbol claims; a resource_id or path is required."}
        resource_type: {type: string, enum: [file, directory, symbol, command, schema, endpoint, test_suite, custom], description: "Required nonblank resource category. The service does not enforce this documented enum, so other nonempty categories may be stored; file, directory, and symbol receive specialized resource handling."}
        path: {type: string, description: "Optional workspace-relative resource path. When nonempty, the HTTP handler rejects paths escaping the selected workspace; resource_id may be supplied instead."}
        symbol: {type: string, description: "Optional symbol name used to derive a symbol resource ID and resolve symbol-specific resource metadata."}
        mode: {type: string, enum: [read, write, review, exclusive], description: "Required claim mode. The service accepts read, write, review, or exclusive; the former OpenAPI values shared, advisory, and execution are not accepted by this implementation."}
        run_id: {type: string, description: "Optional run identifier forwarded to claim creation and related events."}
        base_hash: {type: string, description: "Optional caller-provided resource revision/hash evidence stored on the claim; creation does not verify it against current contents."}
        ttl_seconds: {type: integer, minimum: 1, description: "Optional requested lease duration in seconds; omission or a nonpositive value falls back to a 15-minute lease."}
        rationale: {type: string, description: "Optional rationale stored after text redaction."}
    ClaimExtendInput:
      type: object
      properties:
        ttl_seconds: {type: integer, minimum: 1, description: "Requested new lease duration in seconds. Missing, invalid, or nonpositive values currently reach the service as zero and use its 15-minute default."}
    Claim:
      type: object
      required: [id, workspace_id, agent_id, task_id, resource_id, resource_type, mode, state, acquired_at, lease_expires_at]
      properties:
        id: {type: string, description: "Stable claim identifier."}
        workspace_id: {type: string, description: "Workspace to which the API binds this claim after creation; list and detail reads are scoped by this value."}
        agent_id: {type: string, description: "Agent identity that owns the claim."}
        session_id: {type: string, description: "The response model has an optional session field, but the current HTTP mapper never populates it, so this field is omitted from current claim responses."}
        task_id: {type: string, description: "Task associated with the claim and used by claim transition operations."}
        resource_id: {type: string, description: "Canonical resource identifier protected by this claim."}
        resource_type: {type: string, description: "Resource category loaded from the resource record, not copied directly from the claim row."}
        path: {type: string, description: "Resource path loaded from the resource record; omitted when empty."}
        symbol: {type: string, description: "Resource symbol name loaded from the resource record; omitted when empty."}
        mode: {type: string, description: "Stored claim type/mode (read, write, review, or exclusive)."}
        base_hash: {type: string, description: "Optional hash evidence supplied at claim creation; omitted when empty."}
        state: {type: string, enum: [active, released, revoked, suspended, expired], description: "Persisted claim status. Creation returns active; leases can later be released or expire during maintenance/reconciliation."}
        rationale: {type: string, description: "Text-redacted rationale; omitted when empty."}
        acquired_at: {type: string, format: date-time, description: "Claim creation time returned as the acquisition timestamp."}
        lease_expires_at: {type: string, format: date-time, description: "Lease expiration timestamp; creation defaults to 15 minutes when no positive TTL is provided."}
    Claims:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Claim'}, description: "Claims associated with the selected workspace, ordered by the underlying store before page slicing."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next page, or null when there are no further items."}
    Contention:
      type: object
      required: [id, workspace_id, resource_id, requested_resource_id, requested_agent_id, requested_task_id, requested_mode, current_owner_claim_id, current_owner_agent_id, state, reason, acquired_at, lease_expires_at, allowed_resolutions]
      properties:
        id: {type: string, description: "Contention record identifier created when an attempted claim conflicts with an existing claim."}
        workspace_id: {type: string, description: "Workspace inferred from the challenged owner claim and used to scope the contention."}
        resource_id: {type: string, description: "Resource identifier from the attempted claim that encountered a conflict; it can differ from the incumbent claim's resource for overlapping resources."}
        requested_resource_id: {type: string, description: "Resource identifier requested by the contender; it may equal resource_id for a direct conflict."}
        requested_agent_id: {type: string, description: "Agent identity that attempted to acquire the conflicting claim."}
        requested_task_id: {type: string, description: "Task identifier supplied for the attempted claim."}
        requested_mode: {type: string, description: "Claim mode requested by the contender."}
        requested_path: {type: string, description: "Optional resource path supplied by the contender; omitted when empty."}
        current_owner_claim_id: {type: string, description: "Existing claim challenged by the request."}
        current_owner_agent_id: {type: string, description: "Agent currently associated with the challenged claim."}
        state: {type: string, description: "Contention status, normally open until a supported human resolution records it as resolved."}
        reason: {type: string, description: "Conflict explanation recorded by claim conflict detection."}
        acquired_at: {type: string, format: date-time, description: "Contention creation timestamp."}
        lease_expires_at: {type: string, format: date-time, description: "Expiration timestamp of the challenged owner claim; this is not the contender's requested lease."}
        allowed_resolutions: {type: array, items: {type: string}, description: "Currently advertised values are keep_owner, transfer, extend_lease, and reject_contender. keep_owner and reject_contender close the contention without changing the incumbent claim; transfer assigns its owner/task/mode to the requester; extend_lease adds 15 minutes. The resolver also recognizes split and narrow but rejects them because resource-specific semantics are not implemented."}
    Contentions:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Contention'}, description: "Contentions associated with owner claims in the selected workspace, optionally filtered by resource_id and ordered by creation time and ID."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next page, or null when there are no further items."}
    Vote:
      type: object
      required: [id, proposal_id, agent_id, decision, policy_weight, policy_version, created_at]
      properties:
        id: {type: string, description: "Vote row identifier; a caller-supplied identifier can update an existing row with the same ID."}
        proposal_id: {type: string, description: "Proposal receiving this vote."}
        agent_id: {type: string, description: "Agent identity attributed to the vote; the server derives policy weight from the stored agent role, or uses weight 1 when unavailable."}
        session_id: {type: string, description: "Optional session attributed to the vote; omitted when empty."}
        decision: {type: string, enum: [approve, reject, abstain, veto], description: "Normalized decision used in consensus aggregation."}
        policy_weight: {type: integer, minimum: 1, description: "Weight stored when the vote is cast: security role 3, architect or reviewer role 2, and all other or missing roles 1."}
        policy_version: {type: string, description: "Policy label recorded for the vote; the current implementation uses default-v1."}
        rationale: {type: string, description: "Text-redacted rationale; omitted when empty."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "Optional caller-provided confidence; the server does not currently enforce the documented numeric range."}
        created_at: {type: string, format: date-time, description: "Stored vote creation timestamp used for stable list ordering."}
    Votes:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Vote'}, description: "Votes for the workspace-scoped proposal, ordered by creation timestamp and ID before pagination."}
        next_cursor: {type: [string, 'null'], description: "Opaque cursor for the next response page, or null when no further page is available."}
    VoteInput:
      type: object
      required: [agent_id, decision, rationale]
      additionalProperties: false
      properties:
        id: {type: string, description: "Optional vote row ID; when omitted a timestamp-based ID is generated. Reusing an ID updates that vote row."}
        agent_id: {type: string, description: "Required nonblank agent identifier used for attribution and role-based weight lookup; existence is not required for a default weight of 1."}
        session_id: {type: string, description: "Optional session attribution stored with the vote; surrounding whitespace is trimmed."}
        decision: {type: string, enum: [approve, reject, abstain, veto], description: "Required decision; the handler trims and lowercases it before checking the four supported values."}
        rationale: {type: string, description: "Required nonblank rationale, text-redacted before persistence and in the response."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "Optional confidence value persisted with the vote; the handler currently does not enforce the documented 0-to-1 range."}
    VoteResult:
      type: object
      required: [vote, consensus]
      properties:
        vote: {$ref: '#/components/schemas/Vote', description: "The recorded or updated vote with server-derived policy weight and version."}
        consensus: {$ref: '#/components/schemas/Consensus', description: "Consensus recalculated from stored votes in the same transaction as this vote."}
    Consensus:
      type: object
      required: [proposal_id, outcome, approve_weight, reject_weight, abstain_weight, veto_weight, quorum, threshold, votes_cast, policy_version, explanation, calculated_at]
      properties:
        proposal_id: {type: string, description: "Proposal whose stored votes were aggregated."}
        outcome: {type: string, enum: [pending, approved, blocked], description: "Approved requires approve weight at least the threshold, no rejects or vetoes, and votes cast at least quorum; any reject or veto blocks; otherwise outcome is pending."}
        approve_weight: {type: integer, minimum: 0, description: "Sum of stored policy weights for approve votes."}
        reject_weight: {type: integer, minimum: 0, description: "Sum of stored policy weights for reject votes."}
        abstain_weight: {type: integer, minimum: 0, description: "Sum of stored policy weights for abstain votes; abstentions contribute to votes_cast but not approval."}
        veto_weight: {type: integer, minimum: 0, description: "Sum of stored policy weights for veto votes; any veto blocks approval."}
        quorum: {type: integer, minimum: 1, description: "Minimum number of vote rows required for approval; currently fixed at 2 and counts abstentions."}
        threshold: {type: integer, minimum: 1, description: "Minimum aggregate approve weight required for approval; currently fixed at 2."}
        votes_cast: {type: integer, minimum: 0, description: "Number of stored vote rows across all decisions, including abstain."}
        policy_version: {type: string, description: "Policy version from the last row observed during aggregation; it is not a single validated version for the entire vote set."}
        explanation: {type: string, description: "Human-readable summary assembled from the aggregate weights and outcome."}
        calculated_at: {type: string, format: date-time, description: "UTC timestamp when this response calculation ran; it is not the time of the most recent vote."}
    ConsensusAnalytics:
      type: object
      required: [window, generated_at, proposal_count, consensus_count, success_rate, rejection_rate, abstention_rate, mean_time_to_consensus_seconds, p50_time_to_consensus_seconds, p95_time_to_consensus_seconds, policy_overrides, human_interventions, quorum_failures, agent_participation]
      description: Workspace analytics projection over the requested time window. The component queries are independent and are not assembled from one database snapshot; policy_overrides currently counts all workspaces, unlike the other workspace-filtered metrics.
      properties:
        window: {type: object, required: [from, to], description: "Normalized UTC half-open range used by the calculation.", properties: {from: {type: string, format: date-time, description: "Inclusive UTC start timestamp."}, to: {type: string, format: date-time, description: "Exclusive UTC end timestamp."}}}
        generated_at: {type: string, format: date-time, description: "UTC timestamp when the response calculation began; it is not a database snapshot timestamp."}
        proposal_count: {type: integer, minimum: 0, description: "Workspace proposals created in [from,to); independent of whether they have votes or consensus snapshots."}
        consensus_count: {type: integer, minimum: 0, description: "Approved plus blocked consensus snapshot rows created in the window. Every matching snapshot row counts, so repeated snapshots for one proposal increase this count."}
        success_rate: {type: number, minimum: 0, maximum: 1, description: "Approved snapshot rows divided by consensus_count; zero when consensus_count is zero."}
        rejection_rate: {type: number, minimum: 0, maximum: 1, description: "Blocked snapshot rows divided by consensus_count; zero when consensus_count is zero."}
        abstention_rate: {type: number, minimum: 0, maximum: 1, description: "Abstain vote rows divided by all vote rows in the workspace/window; zero when no votes exist."}
        mean_time_to_consensus_seconds: {type: number, minimum: 0, description: "Arithmetic mean of seconds from proposal creation to each approved/blocked snapshot in the window; zero when there are no finalized snapshots."}
        p50_time_to_consensus_seconds: {type: number, minimum: 0, description: "Nearest-rank-style median selected by sorting durations and rounding (n-1)*0.50 to the nearest index; zero when empty."}
        p95_time_to_consensus_seconds: {type: number, minimum: 0, description: "Nearest-rank-style 95th percentile selected by sorting durations and rounding (n-1)*0.95 to the nearest index; zero when empty."}
        policy_overrides: {type: integer, minimum: 0, description: "Approved human-approval rows with override_policy=1 in the time window. Current query omits workspace_id filtering, so this is a cross-workspace count, not a workspace metric."}
        human_interventions: {type: integer, minimum: 0, description: "Workspace audit rows in the window whose action matches human.% or contains approval; this is a SQL-pattern count, not a semantic classification of every human action."}
        quorum_failures: {type: integer, minimum: 0, description: "Pending consensus snapshot rows created in the window; this does not independently establish that quorum was the reason each remained pending."}
        agent_participation: {type: array, items: {$ref: '#/components/schemas/AgentParticipation'}, description: "Per-agent counts of vote rows in the workspace/window, sorted by agent_id. Every vote increments votes, while only approve/reject/abstain/veto labels increment the corresponding subtype."}
    AgentParticipation:
      type: object
      required: [agent_id, votes, approvals, rejections, abstentions, vetoes]
      properties:
        agent_id: {type: string, description: "Agent identifier from vote rows; the result is sorted lexicographically by this value."}
        votes: {type: integer, minimum: 0, description: "All vote rows for this agent in the workspace/window, including unrecognized vote labels."}
        approvals: {type: integer, minimum: 0, description: "Vote rows whose decision is exactly approve."}
        rejections: {type: integer, minimum: 0, description: "Vote rows whose decision is exactly reject."}
        abstentions: {type: integer, minimum: 0, description: "Vote rows whose decision is exactly abstain; these rows contribute to the workspace abstention rate."}
        vetoes: {type: integer, minimum: 0, description: "Vote rows whose decision is exactly veto."}
    Policy:
      type: object
      required: [id, workspace_id, name, status, scope, selector, severity, enforcement_mode, human_approval_required, metadata, created_at, updated_at]
      properties:
        id: {type: string, description: "Stable policy identifier, supplied at creation or generated by the server."}
        workspace_id: {type: string, description: "Owning workspace used to scope policy reads and lifecycle changes."}
        name: {type: string, description: "Display name; creation requires a nonblank value."}
        status: {type: string, enum: [disabled, active], description: "Enforcement lifecycle state; new policies and clones start disabled, and enable/publish activate them."}
        current_revision_id: {type: string, description: "Identifier of the current draft or published revision; omitted when no value is stored."}
        scope: {type: string, description: "Scope label stored with the policy; omission on creation defaults to workspace."}
        selector: {type: object, additionalProperties: true, description: "Arbitrary JSON selector attributes persisted with the policy; interpretation depends on policy evaluation rules."}
        severity: {type: string, description: "Severity label; omission on creation defaults to normal."}
        enforcement_mode: {type: string, description: "Enforcement mode label; omission on creation defaults to advisory."}
        human_approval_required: {type: boolean, description: "Policy setting indicating whether evaluation requires human approval."}
        metadata: {type: object, additionalProperties: true, description: "Arbitrary JSON metadata stored separately from the policy revision definition."}
        created_at: {type: string, format: date-time, description: "Policy creation timestamp."}
        updated_at: {type: string, format: date-time, description: "Timestamp of the latest policy-level update; draft/revision lifecycle actions may update this value."}
    Policies:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Policy'}, description: "Workspace policies ordered by creation time and ID before pagination."}
        next_cursor: {type: [string, 'null'], description: "Opaque pagination cursor or null when no further page is available."}
    PolicyInput:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        id: {type: string, description: "Optional policy identifier; omission generates a timestamp-based identifier."}
        name: {type: string, description: "Required nonblank policy name."}
        scope: {type: string, description: "Optional policy scope label; defaults to workspace when empty."}
        selector: {type: object, additionalProperties: true, description: "Optional arbitrary JSON selector, stored separately from the versioned definition."}
        severity: {type: string, description: "Optional severity label; defaults to normal when empty."}
        enforcement_mode: {type: string, description: "Optional enforcement mode; defaults to advisory when empty."}
        human_approval_required: {type: boolean, description: "Whether policy evaluations should require human approval; defaults to false."}
        metadata: {type: object, additionalProperties: true, description: "Optional arbitrary JSON metadata attached to the policy record."}
        definition: {type: object, additionalProperties: true, description: "Required versioned policy-rule document; an empty object is persisted when decoded as null."}
    PolicyRevision:
      type: object
      required: [id, policy_id, version, status, definition, created_by, created_at]
      properties:
        id: {type: string, description: "Revision identifier, conventionally the policy ID followed by its revision number."}
        policy_id: {type: string, description: "Policy owning this immutable revision record."}
        version: {type: integer, minimum: 1, description: "Monotonically assigned revision number within the policy."}
        status: {type: string, enum: [draft, published], description: "Revision lifecycle status; publishing a policy marks its current revision published."}
        definition: {type: object, additionalProperties: true, description: "JSON policy definition captured for this revision."}
        created_by: {type: string, description: "Actor ID recorded when the revision was created or cloned."}
        created_at: {type: string, format: date-time, description: "Revision creation timestamp."}
    PolicyRevisions:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PolicyRevision'}, description: "Revisions for the workspace-scoped policy, ordered by descending version."}
        next_cursor: {type: [string, 'null'], description: "Opaque pagination cursor or null when no further page is available."}
    PolicyImpact:
      type: object
      required: [active_sessions, active_claims, open_proposals, active_transactions]
      properties:
        active_sessions: {type: integer, minimum: 0, description: "Count of sessions whose stored status is active or running."}
        active_claims: {type: integer, minimum: 0, description: "Count of claims whose stored status is active."}
        open_proposals: {type: integer, minimum: 0, description: "Count of proposals whose status is pending or in_review."}
        active_transactions: {type: integer, minimum: 0, description: "Count of transactions whose status is pending or running."}
    PolicyTransition:
      type: object
      required: [policy, impact]
      properties:
        policy: {$ref: '#/components/schemas/Policy', description: "Policy representation after the requested lifecycle action."}
        impact: {$ref: '#/components/schemas/PolicyImpact', description: "Current global activity counts returned alongside policy transitions; query failures may leave individual counts at zero."}
    PolicySchemaResponse:
      type: object
      required: [schema_version, schema]
      properties:
        schema_version: {type: string, const: '1', description: "Version identifier for this introspection schema."}
        schema: {$ref: '#/components/schemas/PolicyInputSchema', description: "JSON Schema-like shape describing the accepted policy creation input."}
    PolicyInputSchema:
      type: object
      required: [type, required, properties]
      properties:
        type: {type: string, const: object, description: "The policy input root must be a JSON object."}
        required: {type: array, items: {type: string}, const: [name, definition], description: "Required top-level policy input keys."}
        properties:
          type: object
          required: [name, scope, selector, severity, enforcement_mode, human_approval_required, definition, metadata]
          properties:
            name: {type: object, description: "Name field type declaration.", required: [type], properties: {type: {type: string, const: string, description: "Name is a string."}}}
            scope: {type: object, description: "Scope field type declaration.", required: [type], properties: {type: {type: string, const: string, description: "Scope is a string."}}}
            selector: {type: object, description: "Selector field type declaration.", required: [type], properties: {type: {type: string, const: object, description: "Selector is an object."}}}
            severity: {type: object, description: "Severity field type declaration.", required: [type], properties: {type: {type: string, const: string, description: "Severity is a string."}}}
            enforcement_mode: {type: object, description: "Enforcement mode field type declaration.", required: [type], properties: {type: {type: string, const: string, description: "Enforcement mode is a string."}}}
            human_approval_required: {type: object, description: "Human approval setting type declaration.", required: [type], properties: {type: {type: string, const: boolean, description: "Human approval requirement is a boolean."}}}
            definition: {type: object, description: "Versioned definition field type declaration.", required: [type], properties: {type: {type: string, const: object, description: "The definition is an object."}}}
            metadata: {type: object, description: "Metadata field type declaration.", required: [type], properties: {type: {type: string, const: object, description: "Metadata is an object."}}}
    PolicyValidation:
      type: object
      required: [valid, result, policy_id, policy_revision_id, issues, simulation, deterministic_key]
      properties:
        valid: {type: boolean, description: "Whether validation found no blocking issues."}
        result: {type: string, enum: [pass, fail], description: "Coarse validation outcome corresponding to valid."}
        policy_id: {type: string, description: "Policy evaluated by the validation operation."}
        policy_revision_id: {type: string, description: "Revision used to resolve the policy definition."}
        issues: {type: array, items: {type: string}, description: "Validation issue messages; empty when no issues are reported."}
        simulation: {type: boolean, const: true, description: "Always true for this validation response; validation does not itself apply policy effects."}
        deterministic_key: {type: string, description: "Stable key derived by the evaluator for correlating equivalent evaluation inputs."}
    PolicyEvaluationInput:
      type: object
      required: [subject_type, subject_id]
      properties:
        subject_type: {type: string, description: "Required type/category of the subject being evaluated."}
        subject_id: {type: string, description: "Required identifier of the subject being evaluated."}
        evidence: {type: [array, 'null'], items: {type: string}, description: "Optional evidence strings supplied to the evaluator; omitted or null means no evidence list."}
    PolicyEvaluation:
      type: object
      required: [id, policy_id, policy_revision_id, subject_type, subject_id, result, matched_rules, evidence, remediation, human_approval_required, deterministic_key, simulation, evaluated_at]
      properties:
        id: {type: string, description: "Evaluation record identifier; simulation results may not be persisted."}
        policy_id: {type: string, description: "Policy evaluated."}
        policy_revision_id: {type: string, description: "Policy revision whose definition was evaluated."}
        subject_type: {type: string, description: "Type/category of the evaluated subject."}
        subject_id: {type: string, description: "Identifier of the evaluated subject."}
        result: {type: string, enum: [pass, warn], description: "Evaluation outcome; this API projection currently exposes pass or warn."}
        matched_rules: {type: array, items: {type: string}, description: "Rule identifiers or labels reported as matched by the evaluator."}
        evidence: {type: [array, 'null'], items: {type: string}, description: "Evidence carried into the result; null is distinct from an empty array."}
        remediation: {type: array, items: {type: string}, description: "Remediation guidance emitted by matched policy rules."}
        human_approval_required: {type: boolean, description: "Whether the policy result requires a human approval step."}
        deterministic_key: {type: string, description: "Deterministic correlation key for equivalent evaluation inputs."}
        simulation: {type: boolean, description: "True when the operation evaluates without persisting or applying effects; false for a committed evaluation."}
        evaluated_at: {type: string, format: date-time, description: "UTC time at which the policy evaluation ran."}
    Approval:
      type: object
      required: [id, workspace_id, subject, reason, risk, status, required_role, decision_metadata, requested_by, override_policy, created_at, updated_at]
      properties:
        id: {type: string, description: "Approval request identifier, supplied by the caller or generated by the server."}
        workspace_id: {type: string, description: "Workspace associated with the approval through its proposal."}
        proposal_id: {type: string, description: "Optional associated proposal; omitted when no proposal is recorded."}
        task_id: {type: string, description: "Optional task identifier recorded with the request; omitted when empty."}
        subject: {type: string, description: "Required subject/title of the approval request."}
        reason: {type: string, description: "Required request rationale; text-redacted before persistence."}
        risk: {type: string, description: "Risk copied from the associated proposal, defaulting to normal when no proposal risk is available."}
        status: {type: string, enum: [requested, approved, rejected, changes_requested, deferred], description: "Request lifecycle state; decisions are only accepted while status is requested."}
        required_role: {type: string, description: "Currently fixed to human in the response projection."}
        decision: {type: string, description: "Decision label returned when present; omitted by the current response scanner unless populated by another writer."}
        decision_metadata: {type: object, additionalProperties: true, description: "Metadata map returned by the scanner; currently initialized as an empty object rather than hydrated from stored decision metadata."}
        requested_by: {type: string, description: "Actor ID recorded when the request was created."}
        decided_by: {type: string, description: "Actor ID that made the decision; omitted while empty."}
        override_policy: {type: boolean, description: "Whether this approval request explicitly permits a policy override; exercising it also requires the override permission header."}
        created_at: {type: string, format: date-time, description: "Approval request creation timestamp."}
        updated_at: {type: string, format: date-time, description: "Timestamp updated when a decision is recorded."}
    Approvals:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Approval'}, description: "Workspace-associated approval requests ordered by creation time and ID."}
        next_cursor: {type: [string, 'null'], description: "Opaque pagination cursor or null when no further page is available."}
    ApprovalInput:
      type: object
      required: [subject, reason]
      additionalProperties: false
      properties:
        id: {type: string, description: "Optional approval ID; omission generates a timestamp-based ID."}
        proposal_id: {type: string, description: "Optional proposal association; when provided it must identify a proposal in the current workspace."}
        task_id: {type: string, description: "Optional task identifier recorded on the approval request."}
        subject: {type: string, description: "Required nonblank approval subject."}
        reason: {type: string, description: "Required nonblank request rationale; redacted before persistence."}
        risk: {type: string, description: "Accepted by the request decoder but currently not persisted from this input; response risk is derived from the associated proposal or defaults to normal."}
        required_role: {type: string, description: "Accepted by the request decoder but current response projection sets required_role to human."}
        decision_metadata: {type: object, additionalProperties: true, description: "Arbitrary metadata included in the audit payload; current approval response does not hydrate this value."}
        override_policy: {type: boolean, description: "Explicitly permits a later policy override; actual override still requires the override permission header."}
    ApprovalDecisionInput:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, description: "Optional decision rationale; reject and request-changes actions require a nonblank value and the value is redacted before storage."}
        decision_metadata: {type: object, additionalProperties: true, description: "Arbitrary metadata serialized into the audit event; it is not currently copied into the approval response."}
        override: {type: boolean, description: "Requests a policy override; the approval must have override_policy enabled and the caller must send X-Override-Permission: true."}
    Transaction:
      type: object
      required: [id, workspace_id, proposal_id, run_id, before_git_hash, status, applied_by, metadata]
      properties:
        id: {type: string, description: "Transaction identifier, commonly assigned by the transaction service."}
        workspace_id: {type: string, description: "Workspace owning the proposal associated with this transaction."}
        proposal_id: {type: string, description: "Proposal whose patch is being managed by the transaction."}
        run_id: {type: string, description: "Run identifier associated with transaction execution."}
        before_git_hash: {type: string, description: "Repository revision recorded before application."}
        after_git_hash: {type: string, description: "Repository revision observed after application; omitted when not available."}
        status: {type: string, enum: [pending, staged, running, applied, cancelled, failed], description: "Transaction lifecycle state as persisted by the transaction manager."}
        applied_by: {type: string, description: "Actor recorded as responsible for applying the transaction."}
        applied_at: {type: string, format: date-time, description: "Application timestamp; omitted before successful application."}
        rollback_patch_path: {type: string, description: "Workspace-relative rollback patch artifact path when compensation is available; omitted when empty."}
        metadata: {type: object, additionalProperties: true, description: "Arbitrary transaction metadata decoded from the stored JSON object."}
    Transactions:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Transaction'}, description: "Transactions associated with proposals in the selected workspace, ordered by transaction ID."}
        next_cursor: {type: [string, 'null'], description: "Opaque pagination cursor or null when no further page is available."}
    TransactionPhase:
      type: object
      required: [id, transaction_id, phase, status, actor, inputs, outputs, recovery_state, created_at]
      properties:
        id: {type: string, description: "Transaction phase record identifier."}
        transaction_id: {type: string, description: "Transaction that owns this phase record."}
        phase: {type: string, description: "Operation phase label, such as stage, apply, validate, cancel, or retry."}
        status: {type: string, description: "Outcome/status recorded for this phase."}
        actor: {type: string, description: "Actor associated with the phase operation."}
        reason: {type: string, description: "Optional redacted reason supplied for the operation."}
        request_id: {type: string, description: "Optional request correlation identifier."}
        inputs: {type: object, additionalProperties: true, description: "Arbitrary structured input evidence recorded for the phase."}
        outputs: {type: object, additionalProperties: true, description: "Arbitrary structured output evidence recorded for the phase."}
        log_ref: {type: string, description: "Optional reference to detailed phase logs."}
        failure_code: {type: string, description: "Optional machine-readable failure category."}
        recovery_state: {type: string, description: "Recovery progress or disposition recorded for the phase."}
        started_at: {type: string, format: date-time, description: "Optional phase start timestamp."}
        ended_at: {type: string, format: date-time, description: "Optional phase end timestamp."}
        created_at: {type: string, format: date-time, description: "Phase record creation timestamp."}
    TransactionPhases:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TransactionPhase'}, description: "Recorded phases for a transaction, in the order provided by the phase endpoint."}
        next_cursor: {type: [string, 'null'], description: "Opaque pagination cursor or null when no further page is available."}
    TransactionRecovery:
      type: object
      required: [transaction_id, status, repository_state, actions]
      properties:
        transaction_id: {type: string, description: "Transaction inspected by the recovery operation."}
        status: {type: string, description: "Recovery assessment status reported by the transaction service."}
        repository_state: {type: string, description: "Observed repository state relevant to whether recovery can proceed."}
        actions: {type: array, items: {type: string}, description: "Recovery actions reported as available or performed; this list is advisory output, not an authorization grant."}
        blocked_reason: {type: string, description: "Reason recovery is unavailable or blocked, when one is reported."}
    RunControl:
      type: object
      required: [run_id, workspace_id, goal, state, active_agent_count, active_deliberations, open_proposals, pending_approvals, blockers, updated_at]
      properties:
        run_id: {type: string}
        workspace_id: {type: string}
        goal: {type: string}
        state: {type: string, enum: [stopped, starting, active, paused-intake, draining, stopping, degraded]}
        active_agent_count: {type: integer, minimum: 0}
        active_deliberations: {type: integer, minimum: 0}
        open_proposals: {type: integer, minimum: 0}
        pending_approvals: {type: integer, minimum: 0}
        blockers: {type: integer, minimum: 0}
        updated_at: {type: string, format: date-time}
    RunStartInput:
      type: object
      properties:
        run_id: {type: string}
        goal: {type: string}
    RunTransition:
      type: object
      required: [run_id, state]
      properties:
        run_id: {type: string}
        state: {type: string}
    DashboardSummary:
      type: object
      required: [workspace_id, generated_at, measurement_window, agents_online, proposal_queue, consensus_success_rate, policy_pass_rate, transaction_manager, mcp_enforcement, memory_oracle, run_state, repository]
      properties:
        workspace_id: {type: string, description: "Workspace whose proposal queue, policy rate, run state, and repository status are summarized."}
        generated_at: {type: string, format: date-time, description: "UTC time at which the dashboard projection was assembled."}
        measurement_window: {type: object, required: [from, to], description: "Rolling 24-hour UTC interval used for consensus and policy rates; queue counts are current-state counts, not limited to this interval.", properties: {from: {type: string, format: date-time, description: "Inclusive lower boundary of the rate calculation interval."}, to: {type: string, format: date-time, description: "Exclusive upper boundary of the rate calculation interval, captured as generated_at."}}}
        agents_online: {type: integer, minimum: 0, description: "Global enabled-agent count with status ready or idle; this count is not scoped to the selected workspace and does not probe process liveness."}
        proposal_queue: {type: object, required: [pending, in_review, approved, rejected], description: "Workspace proposal counts grouped by stored lifecycle status; accepted is included in the approved count.", properties: {pending: {type: integer, description: "Workspace proposals with status pending."}, in_review: {type: integer, description: "Workspace proposals with status in_review."}, approved: {type: integer, description: "Workspace proposals with status accepted or approved."}, rejected: {type: integer, description: "Workspace proposals with status rejected."}}}
        consensus_success_rate: {type: number, minimum: 0, maximum: 1, description: "Approved consensus snapshots divided by workspace snapshots with approved or blocked status inside the measurement window; zero when no finalized snapshots exist."}
        policy_pass_rate: {type: number, minimum: 0, maximum: 1, description: "Passing workspace policy evaluations divided by all workspace evaluations in the measurement window; zero when there are no evaluations."}
        transaction_manager: {type: string, description: "Currently hardcoded to ready; this dashboard field does not probe transaction execution or locks."}
        mcp_enforcement: {type: string, description: "Currently hardcoded to orchestrator-only; it is an informational label, not a runtime policy verification."}
        memory_oracle: {type: string, description: "Currently hardcoded to ready; this dashboard field does not probe memory service behavior."}
        run_state: {type: string, description: "State from the most recently started workspace run, or stopped when no state is returned."}
        repository: {type: object, additionalProperties: true, description: "Repository inspection result for the workspace; on inspection failure the handler returns an object with status unavailable. The detailed shape depends on repository status projection."}
    ActivityItem:
      type: object
      required: [id, type, category, entity_type, severity, title, metadata, created_at]
      properties:
        id: {type: integer, description: "Global event row ID; activity is returned newest-first by this ID."}
        type: {type: string, description: "Persisted event type string."}
        category: {type: string, description: "Prefix of type before the first dot; also used as the activity entity_type projection."}
        actor_id: {type: string, description: "Text-redacted event actor ID; omitted when empty."}
        entity_type: {type: string, description: "Currently identical to category, not a separately resolved domain entity type."}
        entity_id: {type: string, description: "First string value found in selected metadata keys (proposal, claim, approval, transaction, policy, session, contention, vote IDs), text-redacted; omitted if unavailable."}
        severity: {type: string, description: "Lowercased severity string from event metadata, or info when absent or not a string."}
        title: {type: string, description: "Friendly title for selected known event types; other event names are transformed from dotted/underscored identifiers."}
        metadata: {type: object, additionalProperties: true, description: "JSON object payload after heuristic redaction; malformed or non-object payloads yield an empty object in this activity projection."}
        created_at: {type: string, format: date-time, description: "Persisted event creation timestamp."}
    ActivityFeed:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActivityItem'}, description: "Workspace-matching events in descending event ID order, with optional entity, category, actor, and severity filters applied in memory."}
        next_cursor: {type: [string, 'null'], description: "Opaque offset cursor for the next page; this endpoint loads and filters the matching event rows before pagination."}
    Memory:
      type: object
      required: [id, scope, kind, title, body_md, tags, provenance, confidence, reliability, importance, pinned, revision, status, resynthesis_status, created_at, updated_at]
      description: Current memory projection. Workspace-owned and legacy shared rows are readable within the workspace; optional source identifiers and workspace_id are omitted when empty. Title/body and selected provenance data are redacted heuristically on output. Confidence, reliability, and importance range metadata describe intended scale but creation currently does not enforce those bounds.
      properties:
        id: {type: string, description: "Stable memory identifier; created notes use an M-prefixed time-derived identifier and canonical merges create a new identifier."}
        workspace_id: {type: string, description: "Owning workspace; omitted for legacy shared rows."}
        scope: {type: string, description: "Caller-supplied scope label; creation does not validate or normalize it."}
        kind: {type: string, description: "Caller-supplied memory kind label; creation does not validate or normalize it."}
        title: {type: string, description: "Memory title after heuristic text redaction on output."}
        body_md: {type: string, description: "Markdown body after heuristic redaction before persistence and on output."}
        tags: {type: array, items: {type: string}, description: "Tag strings; missing or invalid stored JSON is returned as an empty array."}
        provenance: {type: object, additionalProperties: true, description: "Caller-provided provenance JSON object; missing or invalid stored JSON is returned as an empty object and response values are redacted."}
        source_event_id: {type: integer, format: int64, description: "Optional originating event row ID; omitted when zero or absent."}
        source_session_id: {type: string, description: "Optional source session identifier; omitted when empty."}
        source_proposal_id: {type: string, description: "Optional source proposal identifier; omitted when empty."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "Confidence score; defaults to 0.5 on creation. Bounds are documented but not enforced by the current handler."}
        reliability: {type: number, minimum: 0, maximum: 1, description: "Reliability score; defaults to 0.5 on creation. Bounds are documented but not enforced by the current handler."}
        importance: {type: integer, minimum: 0, maximum: 100, description: "Importance score; omitted input currently persists as 0 despite the database column default. Bounds are not enforced by the handler."}
        pinned: {type: boolean, description: "Whether the note is pinned; changed through the pin and unpin actions."}
        revision: {type: integer, minimum: 1, description: "Current revision number; newly created notes start at 1 and successful revision writes increment it after an expected_revision check."}
        status: {type: string, enum: [active, archived, merged], description: "Lifecycle state. Listing always excludes archived rows; restore changes status to active; merges mark source records merged."}
        resynthesis_status: {type: string, description: "Resynthesis lifecycle marker; the resynthesize action sets requested but does not execute a worker."}
        created_at: {type: string, format: date-time, description: "Database creation timestamp."}
        updated_at: {type: string, format: date-time, description: "Database update timestamp, changed by lifecycle actions and revision writes."}
    Memories:
      type: object
      required: [items]
      description: One ascending keyset-paginated memory page; next_cursor is null when no further row was observed.
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Memory'}, description: "Memory rows matching the list filters, ordered by created_at then id ascending."}
        next_cursor: {type: [string, 'null'], description: "Raw-base64url keyset cursor derived from the last returned created_at and id when an additional row exists."}
    MemoryInput:
      type: object
      required: [title, body_md]
      additionalProperties: false
      description: Strict JSON request for note creation. Only title and body_md are validated as non-blank; scope and kind are accepted as empty when omitted. Confidence/reliability default to 0.5 and importance defaults to 0 in current handler behavior.
      properties:
        scope: {type: string, description: "Optional caller-defined scope label; no enum or non-empty validation is currently applied."}
        kind: {type: string, description: "Optional caller-defined kind label; no enum or non-empty validation is currently applied."}
        title: {type: string, minLength: 1, description: "Required non-blank title; trimmed only for validation, not before persistence."}
        body_md: {type: string, minLength: 1, description: "Required non-blank markdown body; text-redacted before persistence."}
        tags: {type: array, items: {type: string}, description: "Optional tag list; omitted/null is returned as an empty array."}
        provenance: {type: object, additionalProperties: true, description: "Optional free-form provenance object; returned values are heuristically redacted."}
        source_event_id: {type: integer, format: int64, description: "Optional source event row ID; zero is persisted as SQL null."}
        source_session_id: {type: string, description: "Optional source session ID; empty string is persisted as SQL null."}
        source_proposal_id: {type: string, description: "Optional source proposal ID; empty string is persisted as SQL null."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "Optional intended 0..1 score; omission defaults to 0.5. The handler does not enforce the range."}
        reliability: {type: number, minimum: 0, maximum: 1, description: "Optional intended 0..1 score; omission defaults to 0.5. The handler does not enforce the range."}
        importance: {type: integer, minimum: 0, maximum: 100, description: "Optional intended 0..100 score; omission currently persists as 0. The handler does not enforce the range."}
    MemoryRevisionInput:
      type: object
      required: [body_md, expected_revision]
      additionalProperties: false
      description: Strict JSON revision request using optimistic concurrency. expected_revision must be positive and equal the current revision; stale writes return 409.
      properties:
        body_md: {type: string, minLength: 1, description: "Required non-blank replacement markdown body; text-redacted before persistence."}
        title: {type: string, description: "Optional replacement title; an empty value leaves the current title unchanged."}
        reason: {type: string, description: "Accepted but currently ignored; stored revision provenance uses the fixed reason revision."}
        expected_revision: {type: integer, minimum: 1, description: "Required current revision number used to reject stale edits; must be at least 1."}
    MemoryRevision:
      type: object
      required: [id, memory_id, revision, body_md, provenance, created_by, created_at]
      description: Immutable revision record returned in ascending revision order.
      properties:
        id: {type: string, description: "Revision row identifier, conventionally memory ID followed by -r and the revision number."}
        memory_id: {type: string, description: "Memory whose history contains this revision."}
        revision: {type: integer, minimum: 1, description: "Monotonically increasing revision number."}
        body_md: {type: string, description: "Persisted markdown body after heuristic text redaction and redacted again on output."}
        provenance: {type: object, additionalProperties: true, description: "Revision provenance JSON; current writes record the fixed reason revision."}
        created_by: {type: string, description: "Actor ID that submitted the revision."}
        created_at: {type: string, format: date-time, description: "Revision creation timestamp."}
    MemoryRevisions:
      type: object
      required: [items]
      description: Complete unpaginated memory revision history.
      properties: {items: {type: array, items: {$ref: '#/components/schemas/MemoryRevision'}, description: "Immutable revision records in ascending revision order."}}
    MemoryDiff:
      type: object
      required: [memory_id, from_revision, to_revision, changed]
      description: Current implementation is a placeholder projection and does not calculate a content diff; changed is always true.
      properties: {memory_id: {type: string, description: "Requested memory identifier."}, from_revision: {type: string, description: "Requested source revision label, default 1; echoed without lookup."}, to_revision: {type: string, description: "Requested target revision label, default latest; echoed without lookup."}, changed: {type: boolean, description: "Currently always true; not computed by comparing revisions."}, current_body_md: {type: string, description: "Current memory body after heuristic text redaction; this is not a patch or unified diff."}}
    MemoryGraph:
      type: object
      required: [memory_id, aliases]
      description: Alias records connecting this memory ID to canonical merge records.
      properties:
        memory_id: {type: string, description: "Memory whose alias relationships were queried."}
        aliases: {type: array, description: "Rows where memory_id appears as alias_id or canonical_id, ordered by created_at.", items: {type: object, required: [alias_id, canonical_id, reason, created_by, created_at], additionalProperties: false, properties: {alias_id: {type: string, description: "Redirected source memory ID."}, canonical_id: {type: string, description: "Canonical memory ID for the alias."}, reason: {type: string, description: "Merge reason after heuristic text redaction."}, created_by: {type: string, description: "Actor ID after heuristic text redaction."}, created_at: {type: string, format: date-time, description: "Alias row creation time."}}}}
    MemorySourceChain:
      type: object
      required: [memory_id, edges]
      description: Structured provenance edges for a memory, separate from free-form provenance JSON.
      properties:
        memory_id: {type: string, description: "Memory whose source relationships were queried."}
        edges: {type: array, description: "Provenance edges ordered by created_at.", items: {type: object, required: [source_type, source_id, relation, created_at], additionalProperties: false, properties: {source_type: {type: string, description: "Category of the source record."}, source_id: {type: string, description: "Source record identifier after heuristic text redaction."}, relation: {type: string, description: "Relationship label connecting the source to this memory."}, created_at: {type: string, format: date-time, description: "Provenance edge creation time."}}}}
    Notification:
      type: object
      required: [id, workspace_id, recipient_id, severity, category, title, body, actionable, created_at]
      properties:
        id: {type: string, description: "Stable notification identifier."}
        workspace_id: {type: string, description: "Workspace that owns the notification."}
        recipient_id: {type: string, description: "Recipient identity or wildcard recipient; text-redacted before returning."}
        severity: {type: string, enum: [info, warning, error, critical], description: "Stored notification severity label."}
        category: {type: string, enum: [approval_required, claim_contention, transaction_failure, policy_intervention, agent_session_failure, repository_degraded, system_warning], description: "Stored attention category used by exact-match list filters."}
        title: {type: string, description: "Notification headline after text redaction."}
        body: {type: string, description: "Notification detail after text redaction."}
        entity_type: {type: string, description: "Optional associated entity category; omitted when empty."}
        entity_id: {type: string, description: "Optional associated entity identifier; omitted when empty."}
        read_at: {type: string, format: date-time, description: "Acknowledgement timestamp; acknowledgement preserves the first timestamp and does not resolve the underlying condition."}
        actionable: {type: boolean, description: "Whether the notification is marked as actionable; actionable counts include only unread items whose resolved_at is null."}
        resolved_at: {type: string, format: date-time, description: "Underlying notification resolution timestamp; omitted when unresolved. Reading/acknowledging does not set this field."}
        created_at: {type: string, format: date-time, description: "Notification creation timestamp, used with ID for descending keyset pagination."}
    Notifications:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Notification'}, description: "Workspace notifications ordered by creation time and ID descending after recipient/category/severity/read/actionable filters."}, next_cursor: {type: [string, 'null'], description: "Raw-base64url cursor encoding the last returned created_at and ID separated by a newline; null when no further page is available."}}
    NotificationCounts:
      type: object
      required: [workspace_id, unread, actionable]
      properties: {workspace_id: {type: string, description: "Workspace whose notifications were counted."}, unread: {type: integer, minimum: 0, description: "Count of unread notifications for the selected recipient scope."}, actionable: {type: integer, minimum: 0, description: "Count of unread notifications with actionable=true and resolved_at unset for the selected recipient scope."}}
    OperationalLog:
      type: object
      required: [id, type, component, severity, payload, created_at]
      properties:
        id: {type: integer, format: int64, description: "Global persisted event row ID."}
        type: {type: string, description: "Stored event type."}
        component: {type: string, description: "Prefix of type before the first dot; the component filter matches event-type prefixes."}
        severity: {type: string, description: "String severity extracted from the payload, defaulting to info when absent or non-string."}
        actor_id: {type: string, description: "Text-redacted actor ID; omitted when empty."}
        request_id: {type: string, description: "Text-redacted string extracted from payload; omitted when absent or non-string."}
        agent_id: {type: string, description: "Text-redacted string extracted from payload; omitted when absent or non-string."}
        session_id: {type: string, description: "Text-redacted string extracted from payload; omitted when absent or non-string."}
        proposal_id: {type: string, description: "Text-redacted string extracted from payload; omitted when absent or non-string."}
        transaction_id: {type: string, description: "Text-redacted string extracted from payload; omitted when absent or non-string."}
        payload: {type: object, additionalProperties: true, description: "Decoded JSON event payload after heuristic redaction; invalid or non-object payloads become an object containing redacted text."}
        created_at: {type: string, format: date-time, description: "Persisted event creation timestamp."}
    OperationalLogs:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/OperationalLog'}, description: "Workspace events in descending global event ID order, projected from the events table; this is not the HTTP logger or a complete process log."}, next_cursor: {type: [string, 'null'], description: "Decimal global event ID of the last returned item when another page exists; send it back as cursor to request older IDs."}}
    AuditEvent:
      type: object
      required: [id, actor_id, action, entity_type, entity_id, payload, created_at]
      properties:
        id: {type: integer, format: int64, description: "Global audit row ID."}
        actor_id: {type: string, description: "Text-redacted actor identifier."}
        action: {type: string, description: "Recorded audit action label."}
        entity_type: {type: string, description: "Recorded entity category associated with the audited action."}
        entity_id: {type: string, description: "Text-redacted identifier of the audited entity."}
        request_id: {type: string, description: "Optional request correlation ID; omitted when absent."}
        reason: {type: string, description: "Optional text-redacted rationale; omitted when empty."}
        payload: {type: object, additionalProperties: true, description: "Decoded audit JSON payload after heuristic redaction; invalid or non-object content is represented as redacted text."}
        created_at: {type: string, format: date-time, description: "Audit row creation timestamp."}
    AuditEvents:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}, description: "Workspace audit rows in descending ID order, filtered by exact actor/action/request/entity values and valid time bounds."}, next_cursor: {type: [string, 'null'], description: "Decimal audit row ID of the last returned item when another page exists; send it back to request older IDs."}}
    EffectiveSettings:
      type: object
      required: [workspace_id, version, sections]
      description: Effective configuration projection across the six built-in settings sections. Defaults are included even when no workspace override exists; secret-like keys are replaced with an object containing only configured.
      properties:
        workspace_id: {type: string, description: "Workspace whose configuration is returned."}
        version: {type: integer, minimum: 0, description: "Latest workspace configuration revision number, or zero when no revision exists."}
        sections: {type: object, description: "Built-in sections with defaults and the current source/version metadata.", additionalProperties: {$ref: '#/components/schemas/EffectiveSettingsSection'}, properties: {general: {$ref: '#/components/schemas/EffectiveSettingsSection'}, governance: {$ref: '#/components/schemas/EffectiveSettingsSection'}, adapters: {$ref: '#/components/schemas/EffectiveSettingsSection'}, mcp: {$ref: '#/components/schemas/EffectiveSettingsSection'}, storage: {$ref: '#/components/schemas/EffectiveSettingsSection'}, notifications: {$ref: '#/components/schemas/EffectiveSettingsSection'}}}
    EffectiveSettingsSection:
      type: object
      required: [values, source, version, restart_required]
      description: One section's sanitized effective values. The current loader overlays only the section from the latest configuration revision; revisions for previous sections are not accumulated when a different section is updated later.
      properties:
        values: {type: object, additionalProperties: true, description: "Setting values for this section. Secret-like keys (key contains secret, token, password, or api_key, case-insensitively) become {configured: boolean}; other values pass through."}
        source: {type: string, enum: [default, workspace], description: "default when this section has no current overlay; workspace when the latest stored revision targets this section."}
        version: {type: integer, minimum: 0, description: "Revision version associated with the workspace overlay; zero for a default-only section."}
        restart_required: {type: boolean, description: "True for mcp and storage, false for the other built-in sections; this is advisory metadata and does not trigger a restart."}
    SettingsSchema:
      type: object
      required: [sections]
      description: Runtime-generated description of the built-in configuration fields; type is inferred from the default value, secret indicates key-name-based sanitization, and the schema does not itself enforce those types during updates.
      properties:
        sections:
          type: object
          description: "The six supported section names and their field schemas."
          additionalProperties: {$ref: '#/components/schemas/SettingsSectionSchema'}
          properties:
            general: {$ref: '#/components/schemas/SettingsSectionSchema'}
            governance: {$ref: '#/components/schemas/SettingsSectionSchema'}
            adapters: {$ref: '#/components/schemas/SettingsSectionSchema'}
            mcp: {$ref: '#/components/schemas/SettingsSectionSchema'}
            storage: {$ref: '#/components/schemas/SettingsSectionSchema'}
            notifications: {$ref: '#/components/schemas/SettingsSectionSchema'}
    SettingsSectionSchema:
      type: object
      required: [fields, restart_required]
      description: Schema for one supported settings section.
      properties:
        fields:
          type: object
          description: "Field definitions; default is the built-in default, type is inferred from that default, and secret reflects key-name matching."
          additionalProperties: {$ref: '#/components/schemas/SettingFieldSchema'}
          properties:
            locale: {$ref: '#/components/schemas/SettingFieldSchema'}
            timezone: {$ref: '#/components/schemas/SettingFieldSchema'}
            approval_required: {$ref: '#/components/schemas/SettingFieldSchema'}
            quorum: {$ref: '#/components/schemas/SettingFieldSchema'}
            require_security_review: {$ref: '#/components/schemas/SettingFieldSchema'}
            default: {$ref: '#/components/schemas/SettingFieldSchema'}
            allow_shell: {$ref: '#/components/schemas/SettingFieldSchema'}
            transport: {$ref: '#/components/schemas/SettingFieldSchema'}
            readonly_repository: {$ref: '#/components/schemas/SettingFieldSchema'}
            wal: {$ref: '#/components/schemas/SettingFieldSchema'}
            retention_days: {$ref: '#/components/schemas/SettingFieldSchema'}
            enabled: {$ref: '#/components/schemas/SettingFieldSchema'}
            default_recipient: {$ref: '#/components/schemas/SettingFieldSchema'}
        restart_required: {type: boolean, description: "True for mcp and storage; false for general, governance, adapters, and notifications."}
    SettingFieldSchema:
      type: object
      required: [default, secret, type]
      description: One setting field's reported default, inferred type, and secret-key indicator.
      properties:
        default: {description: "Built-in default value. Defaults are en-US/UTC for general; approval_required=true, quorum=1, require_security_review=true for governance; default=codex and allow_shell=false for adapters; transport=unix and readonly_repository=true for mcp; wal=true and retention_days=30 for storage; enabled=true and default_recipient=human for notifications."}
        secret: {type: boolean, description: "True when the field name contains secret, token, password, or api_key, case-insensitively. None of the current built-in default fields are secret."}
        type: {type: string, enum: [boolean, number, string], description: "Type inferred from the built-in default value; current values map to boolean, number, or string."}
    SettingsUpdate:
      type: object
      description: PATCH body can contain a values object or flat setting keys; expected_version may provide optimistic concurrency instead of If-Match. When values is present, other setting keys in the body are ignored. The section property is not used to select the target; the path section controls that. SettingsPreflightInput is a separate, stricter shape.
      properties:
        expected_version: {type: integer, minimum: 0, description: "Expected current workspace configuration version; equivalent to If-Match when supplied in the body, and the body value takes precedence if both are present."}
        values: {type: object, additionalProperties: true, description: "Optional nested settings object. If omitted, the handler treats the full request object (except expected_version) as the values to store."}
        section: {type: string, description: "Not used by PATCH to choose the target section; the path parameter selects it. In a flat body without values, this key is stored as a setting value."}
      additionalProperties: true
    SettingsPreflightInput:
      type: object
      required: [section]
      additionalProperties: false
      description: Strict request used only by preflight to identify a supported section and proposed values; unlike PATCH, it does not accept flat keys. The handler currently accepts omitted or null values and treats them like an empty settings map.
      properties:
        section: {type: string, enum: [general, governance, adapters, mcp, storage, notifications], description: "Built-in settings section to validate."}
        values: {type: [object, 'null'], additionalProperties: true, description: "Optional proposed field values. Only numeric governance.quorum is currently range-checked, as an integer from 1 through 100; omitted/null values pass as an empty map."}
    SettingsPreflight:
      type: object
      required: [allowed, version, confirmation_token, impact]
      description: Point-in-time preflight result. The token is a deterministic SHA-256 digest over workspace ID, section, and current version; it is not an expiring reservation or signed authorization credential.
      properties:
        allowed: {type: boolean, description: "True when section/value validation succeeds; this does not indicate that a later update will avoid a version conflict."}
        version: {type: integer, description: "Current workspace settings version observed during preflight."}
        confirmation_token: {type: string, description: "Hex SHA-256 token bound to workspace, section, and version; governance PATCH requires it, other sections currently do not."}
        impact: {type: object, additionalProperties: true, description: "Summary containing section, affected_components (currently just that section), and restart_required for mcp/storage."}
    LiveEventEnvelope:
      type: object
      required: [event_id, workspace_id, sequence, type, occurred_at, payload]
      properties:
        event_id: {type: integer, format: int64, description: "Global SQLite event row ID; IDs belonging to other workspaces can create gaps in this workspace's stream."}
        workspace_id: {type: string, description: "Workspace whose membership filter selected this event."}
        sequence: {type: integer, format: int64, description: "Currently identical to event_id (global event row ID), not a workspace-local consecutive counter."}
        type: {type: string, description: "Persisted event type string."}
        occurred_at: {type: string, format: date-time, description: "Persisted event creation timestamp projected as the occurrence time."}
        actor: {type: string, description: "Text-redacted actor ID; omitted when empty."}
        entity_type: {type: string, description: "Prefix of type before its first dot; this is a naming heuristic, not a foreign-key lookup."}
        entity_id: {type: string, description: "First string value found among selected payload keys (proposal_id, claim_id, vote_id, approval_id, transaction_id, policy_id, session_id), text-redacted; omitted if none is found."}
        payload: {type: object, additionalProperties: true, description: "Parsed and heuristically redacted JSON object. Invalid JSON falls back to an object with redacted text; redaction is not a guarantee that every secret format is removed."}
    LiveEventControl:
      type: object
      required: [kind, workspace_id]
      properties:
        kind: {type: string, enum: [hello, ping, resync_required], description: "Control message discriminator. hello is sent after upgrade, ping periodically reports sequence progress, and resync_required ends replay when the backlog exceeds the server limit."}
        schema_version: {type: string, description: "Protocol schema version, currently 1 and present on hello."}
        workspace_id: {type: string, description: "Workspace associated with the control message."}
        current_sequence: {type: integer, format: int64, description: "Current global event ID included by hello and resync_required; ping uses the separate sequence field."}
        sequence: {type: integer, format: int64, description: "Current global event ID included by ping controls; it is not a workspace-local sequence."}
        resumable: {type: boolean, description: "Hello currently reports true to indicate that last_event_id replay is supported, subject to the bounded replay limit."}
        reason: {type: string, description: "Resync explanation; currently cursor_not_retained when replay query finds more than 1,000 events, which indicates backlog size rather than verified event deletion."}
    EventVersionMarker:
      type: object
      required: [count]
      properties:
        count: {type: integer, minimum: 0, description: "Number of rows counted for the named domain marker; each domain query is independent."}
        latest_at: {type: string, format: date-time, description: "Latest timestamp selected for that domain's marker; omitted when the source query has no timestamp."}
    EventSnapshot:
      type: object
      required: [workspace_id, sequence, generated_at, retention, version_markers, snapshot]
      properties:
        workspace_id: {type: string, description: "Workspace whose bounded event stream and selected domain counts are summarized."}
        sequence: {type: integer, format: int64, minimum: 0, description: "Largest persisted global event ID belonging to the workspace filter, or zero when no matching event is present or the lookup fails."}
        generated_at: {type: string, format: date-time, description: "UTC time when the snapshot response was assembled; component queries are not wrapped in one database transaction."}
        retention: {type: object, required: [mode, resume_by, max_replay_events, resync_endpoint], description: "Fixed descriptors for WebSocket event replay behavior; these values do not configure data retention or event deletion.", properties: {mode: {type: string, description: "Currently append_only_bounded_replay."}, resume_by: {type: string, description: "Currently last_event_id; resume cursor is the global SQLite event ID."}, max_replay_events: {type: integer, minimum: 1, description: "Currently 1,000 replayed events; a larger pending replay produces resync_required and closes the socket."}, resync_endpoint: {type: string, description: "Workspace snapshot endpoint path suggested for reconciliation; this response is a partial summary, not a complete domain export."}}}
        version_markers: {type: object, additionalProperties: {$ref: '#/components/schemas/EventVersionMarker'}, description: "Available per-domain row counts and latest timestamps. Failed marker queries omit that domain; markers are not content hashes or full revision tokens."}
        snapshot: {type: object, required: [workspace, counts, run_state], description: "Partial state projection containing workspace metadata, selected domain counts, and latest run state; fetch collection endpoints for full records.", properties: {workspace: {$ref: '#/components/schemas/Workspace', description: "Workspace registry record at the time it was read."}, counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: "Counts for domains whose independent marker queries succeeded; values can be omitted when their queries fail."}, run_state: {type: string, description: "State of the latest workspace run, defaulting to stopped when no state is returned."}}}
    ContentionResolutionInput:
      type: object
      required: [resolution]
      additionalProperties: false
      properties:
        resolution: {type: string, enum: [keep_owner, transfer, split, narrow, extend_lease, reject_contender], description: "Required resolution choice. keep_owner, transfer, extend_lease, and reject_contender are implemented; split and narrow are recognized but return HTTP 409 as unsupported."}
        reason: {type: string, description: "Optional explanation, text-redacted and recorded in the audit event; it does not affect which resolution is applied."}
    ContentionResolution:
      type: object
      required: [contention_id, state, resolution]
      properties:
        contention_id: {type: string, description: "Identifier of the contention marked resolved."}
        state: {type: string, enum: [resolved], description: "Successful resolution always returns resolved; attempting to resolve a non-open contention returns a conflict instead."}
        resolution: {type: string, description: "Resolution applied to the incumbent claim and contention record."}
    HealthResponse:
      type: object
      required: [status, version, request_id]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        request_id: {type: string}
    StatusResponse:
      type: object
      required: [status, version, api_version, time, request_id]
      properties:
        status: {type: string}
        version: {type: string}
        api_version: {type: string, enum: [v1]}
        time: {type: string, format: date-time}
        request_id: {type: string}
    Problem:
      type: object
      required: [type, title, status, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: string}
        code: {type: string}
        metadata: {type: object, additionalProperties: true}
  responses:
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
