      description: The measurement window is the preceding 24 hours. Consensus success rate is approved finalized snapshots divided by all finalized snapshots. Policy pass rate is pass evaluations divided by all evaluations in the window. The response intentionally excludes proposal, claim, and activity lists.
      responses: {'200': {description: Dashboard summary, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/activity:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: entity, in: query, description: "Exact match against normalized entity_type after lowercasing and trimming the filter.", schema: {type: string}}, {name: category, in: query, description: "Exact match against the lowercased prefix of event type before its first dot.", schema: {type: string}}, {name: actor, in: query, description: "Exact match against the normalized redacted actor value after trimming the filter; sensitive redaction can affect matching.", schema: {type: string}}, {name: severity, in: query, description: "Exact match against payload severity after lowercasing and trimming; missing severity is info.", schema: {type: string}}, {name: cursor, in: query, description: "Opaque raw-base64url encoding of a decimal item offset, returned as next_cursor.", schema: {type: string}}, {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listActivityFeed
      summary: List normalized workspace activity events
      description: Each item contains a stable event type, normalized category/entity linkage, concise display title, and redacted metadata; clients do not parse log strings. Results are cursor-paginated.
      responses: {'200': {description: Activity feed, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityFeed'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/events/ws:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: last_event_id, in: query, description: Resume cursor from the last event received., schema: {type: integer, format: int64, minimum: 0}}, {name: actor_id, in: query, description: Authenticated actor identity for clients unable to set headers., schema: {type: string}}]
    get:
      operationId: connectWorkspaceEvents
      summary: Connect to the authenticated live workspace event stream
      description: The server sends a hello control message followed by stable JSON event envelopes. A bounded 64-message subscriber buffer applies drop-on-overflow backpressure so slow clients never block governance writes. Clients should reconnect with last_event_id; when the retained history cannot satisfy replay, the server sends resync_required.
      responses: {'101': {description: WebSocket connection established}, '400': {$ref: '#/components/responses/Problem'}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/events/snapshot:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getWorkspaceEventSnapshot
      summary: Return bounded current state for deterministic event resynchronization
      description: Returns the current event sequence, workspace state, bounded domain counts, version markers, and the resume/retention contract. Clients use this after a sequence gap, restart, retention truncation, or prolonged sleep, then refetch only domains whose markers changed; the endpoint never returns unbounded event history.
      responses: {'200': {description: Resynchronization snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/EventSnapshot'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: q, in: query, description: "Trimmed substring searched with SQL LIKE against title and body_md; percent and underscore retain SQL wildcard meaning.", schema: {type: string}}, {name: scope, in: query, description: "Optional exact scope filter after trimming whitespace; matching is case-sensitive according to the database collation.", schema: {type: string}}, {name: kind, in: query, description: "Optional exact kind filter after trimming whitespace.", schema: {type: string}}, {name: status, in: query, description: "Optional exact status filter after trimming whitespace. Archived rows are always excluded by the base query, even when status=archived.", schema: {type: string, enum: [active, archived, merged]}}, {name: cursor, in: query, description: "Raw-base64url encoding of the last item's created_at, newline, and id. Results are ordered ascending by created_at then id.", schema: {type: string}}, {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50. The handler fetches one extra row to decide whether to return a next_cursor.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listMemories
      summary: Search and list workspace memories
      description: Searches workspace-owned and legacy shared (workspace_id null) memory rows; archived rows are excluded even when status=archived is requested. Search and exact filters are described by the query parameters. The cursor is a raw-base64url keyset cursor over created_at and id. Returned title/body and provenance are redacted before serialization.
      responses: {'200': {description: Memory collection, content: {application/json: {schema: {$ref: '#/components/schemas/Memories'}}}}, '404': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createMemoryNote
      summary: Create a human memory note
      description: Creates an active revision-1 note, redacts its body before storage and title/body on reads, then writes a memory audit row and event. Only title and body_md are checked for non-blank values by the handler; scope/kind are not validated, and omitted confidence/reliability default to 0.5 while omitted importance is stored as 0. A mutation requires X-Actor-ID.
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryInput'}}}}
      responses: {'201': {description: Memory created, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getMemory
      summary: Get one memory with provenance and revision metadata
      description: Reads a workspace-owned or legacy shared memory entry. Title and body are text-redacted; tags and provenance serialize as an empty array/object when stored JSON is absent or invalid. A memory outside this workspace or a missing memory returns 404.
      responses: {'200': {description: Memory, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}/revisions:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: createMemoryRevision
      summary: Edit a memory as a new immutable revision
      description: Requires expected_revision to match the currently stored revision; stale edits return 409. The body is required and text-redacted before storage. A non-empty title replaces the current title; reason is accepted by the request type but currently is not persisted (revision provenance is stored as reason=revision). Revision history is immutable and the mutation requires X-Actor-ID.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryRevisionInput'}}}}
      responses: {'200': {description: Revised memory, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
    get:
      operationId: listMemoryRevisions
      summary: List immutable memory revisions
      description: Returns all stored revisions in ascending revision order, without pagination. Revision bodies and provenance are redacted for the response. The current memory must be visible in this workspace.
      responses: {'200': {description: Revision history, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryRevisions'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}/diff:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}, {name: from, in: query, description: "Revision label echoed in the response; defaults to the string 1. The current implementation does not calculate a textual diff or validate the requested revision exists.", schema: {type: string, default: '1'}}, {name: to, in: query, description: "Revision label echoed in the response; defaults to latest. The current implementation does not calculate a textual diff or validate the requested revision exists.", schema: {type: string, default: latest}}]
    get:
      operationId: getMemoryRevisionDiff
      summary: Return a bounded memory revision diff
      description: Despite the operation name, this currently returns changed=true, echoes the requested from/to labels, and includes the current redacted body; it does not compute a revision-to-revision diff.
      responses: {'200': {description: Revision diff, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryDiff'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}/graph:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getMemoryGraph
      summary: Return memory aliases and merge redirects
      description: Returns alias rows where this memory is either alias_id or canonical_id, ordered by creation time. Alias reason and creator are text-redacted.
      responses: {'200': {description: Related memory graph, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryGraph'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}/source-chain:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getMemorySourceChain
