      description: Returns provenance edges for this memory ordered by creation time. Source IDs are text-redacted; this response is separate from the memory's free-form provenance JSON.
      responses: {'200': {description: Source chain, content: {application/json: {schema: {$ref: '#/components/schemas/MemorySourceChain'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/memories/{memory_id}/{action}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: memory_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, description: "pin/unpin change the pinned flag; archive/restore change status; merge creates a canonical combined record; merge-legacy marks the source merged into its target; resynthesize only sets resynthesis_status=requested.", schema: {type: string, enum: [pin, unpin, archive, restore, merge, merge-legacy, resynthesize]}}, {name: target_id, in: query, required: false, description: Required for merge and merge-legacy; must identify a different visible memory. Canonical merge adopts the target's scope, kind, title, tags, and importance, concatenates target then source body, averages confidence/reliability, and leaves both inputs as merged aliases. Legacy merge only redirects source to target.", schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: transitionMemory
      summary: Pin, archive, restore, merge, or request memory resynthesis
      description: Requires X-Actor-ID and records an audit/event after the state transition. Resynthesis is a request marker only; it does not run a resynthesis process. merge-legacy is accepted by the handler for compatibility in addition to canonical merge.
      responses: {'200': {description: Updated memory, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/notifications:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: recipient_id, in: query, description: "Recipient filter; omission falls back to X-Actor-ID, and if both are empty the handler does not filter by recipient.", schema: {type: string}}, {name: category, in: query, description: "Exact stored category match after whitespace trimming; not normalized to lowercase by this handler.", schema: {type: string}}, {name: severity, in: query, description: "Exact stored severity match after whitespace trimming; not normalized to lowercase by this handler.", schema: {type: string}}, {name: unread, in: query, description: "When exactly true, returns notifications whose read_at is null; false or omitted adds no filter.", schema: {type: boolean}}, {name: actionable, in: query, description: "When exactly true, returns actionable notifications whose resolved_at is null; this filter does not require the notification to be unread.", schema: {type: boolean}}, {name: cursor, in: query, description: "Raw-base64url encoding of the last returned created_at, newline, and ID; used for descending keyset pagination.", schema: {type: string}}, {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listNotifications
      summary: List actionable attention items
      description: Attention items are distinct from the raw activity stream. Acknowledgement marks an item read but does not resolve the underlying condition.
      responses: {'200': {description: Notification collection, content: {application/json: {schema: {$ref: '#/components/schemas/Notifications'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/notifications/counts:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: recipient_id, in: query, description: "Recipient filter; omission falls back to X-Actor-ID, and if both are empty counts cover every workspace recipient.", schema: {type: string}}]
    get:
