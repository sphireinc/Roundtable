openapi: 3.1.0
info:
  title: Roundtable API
  version: v1
  description: Local-first governed control-plane API.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Lightweight process health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Control-plane status
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeHealthResponse'}
  /api/v1/security/capabilities:
    get:
      operationId: getSecurityCapabilities
      summary: Describe the configured local security boundary
      security: [{HumanBearer: []}, {}]
      responses:
        '200':
          description: Security capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityCapabilities'}
        '401': {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus-compatible low-cardinality HTTP metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
  /api/v1/maintenance:
    get:
      operationId: getMaintenanceStatus
      summary: Inspect SQLite maintenance capabilities and protected tables
      responses:
        '200': {description: Maintenance status, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceStatus'}}}}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/maintenance/integrity-check:
    post:
      operationId: runIntegrityCheck
      summary: Run SQLite integrity check
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Integrity result}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/maintenance/checkpoint:
    post:
      operationId: checkpointDatabase
      summary: Checkpoint the SQLite WAL
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Checkpoint result}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/maintenance/backup:
    post:
      operationId: createDatabaseBackup
      summary: Create a server-side SQLite backup artifact
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {description: Backup artifact reference}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/maintenance/retention:
    post:
      operationId: runRetentionCleanup
      summary: Remove eligible non-immutable notification history
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetentionInput'}}}}
      responses: {'200': {description: Retention result}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/health:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getWorkspaceHealth
      summary: Lightweight workspace health summary
      responses:
        '200':
          description: Workspace health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceHealthResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List registered workspaces
      responses:
        '200':
          description: Workspace collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
                  next_cursor: {type: [string, 'null']}
        '500': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createWorkspace
      summary: Register a workspace without mutating its repository
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceInput'}
      responses:
        '201':
          description: Workspace registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getWorkspace
      summary: Get a registered workspace
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateWorkspace
      summary: Update workspace metadata
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspacePatch'}
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: detachWorkspace
      summary: Detach metadata without deleting the repository
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
      responses:
        '200':
          description: Detached workspace and impact report
          content:
            application/json:
              schema:
                type: object
                required: [workspace, impact]
                properties:
                  workspace: {$ref: '#/components/schemas/Workspace'}
                  impact: {$ref: '#/components/schemas/WorkspaceImpact'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRepositoryStatus
      summary: Get repository status without exposing filesystem paths
      responses:
        '200':
          description: Repository status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryStatus'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/branch-switch/preflight:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post:
      operationId: preflightRepositoryBranchSwitch
      summary: Check blockers before a governed branch switch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchSwitchInput'}
      responses:
        '200':
          description: Branch switch preflight
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BranchSwitchPreflight'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/branch-switch:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
    post:
      operationId: switchRepositoryBranch
      summary: Switch a workspace branch through the governed transaction boundary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchSwitchInput'}
      responses:
        '200':
          description: Branch switched
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BranchSwitchResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/entities:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: q
        in: query
        schema: {type: string}
      - name: type
        in: query
        schema: {type: string, enum: [file, directory, symbol, schema, endpoint, command, test_suite]}
      - name: path
        in: query
        schema: {type: string}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    get:
      operationId: listRepositoryEntities
      summary: Search and paginate the read-only repository entity index
      responses:
        '200':
          description: Repository entities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryEntities'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/repository/entities/{entity_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: entity_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRepositoryEntity
      summary: Get one indexed repository entity and governance context
      responses:
        '200':
          description: Repository entity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryEntity'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    get:
      operationId: listAgents
      summary: List redacted agent registry entries
      responses:
        '200':
          description: Agent registry
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Agent'}}
                  next_cursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: agent_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getAgent
      summary: Get one redacted agent registry entry
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/enable:
    post:
      operationId: enableAgent
      summary: Enable an agent
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent enabled, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/disable:
    post:
      operationId: disableAgent
      summary: Disable an agent using drain semantics
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/agents/{agent_id}/diagnostics:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: agent_id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: runAgentDiagnostics
      summary: Run bounded, read-only adapter and MCP diagnostics
      responses:
        '202':
          description: Diagnostic completed or accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticRun'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listSessions
      summary: List sessions for a workspace
      responses:
        '200': {description: Sessions, content: {application/json: {schema: {$ref: '#/components/schemas/Sessions'}}}}
    post:
      operationId: createSession
      summary: Create and start a governed agent session
      parameters:
        - {$ref: '#/components/parameters/ActorID'}
        - {$ref: '#/components/parameters/ActorRole'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionInput'}}}
      responses:
        '201': {description: Session started, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Get a session
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: session_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{id}/sessions/{session_id}/pause:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post: {operationId: pauseSession, summary: Pause a session, responses: {'200': {description: Paused, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/resume:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post: {operationId: resumeSession, summary: Resume a compatible session, responses: {'200': {description: Resuming, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/stop:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
    post: {operationId: stopSession, summary: Gracefully stop a session, responses: {'200': {description: Stopped, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/terminate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/ActorID'}
      - {$ref: '#/components/parameters/ActorRole'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: terminateSession
      summary: Terminate a session with impact confirmation
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionTerminationInput'}}}
      responses: {'200': {description: Terminated, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/heartbeat:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [starting, active, running, paused, resuming]}}
    post: {operationId: heartbeatSession, summary: Report session heartbeat, responses: {'200': {description: Heartbeat accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/workspaces/{id}/sessions/{session_id}/logs:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, description: "Base64url-encoded offset into the session's ordered event list; malformed cursors return 400.", schema: {type: string}}
      - {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    get:
      operationId: listSessionLogs
      summary: List redacted session event logs
      description: Lists stored agent-session events after resolving the session within this workspace. Payload JSON is redacted and returned as a string; pagination uses the shared offset cursor and is applied after all session events are loaded. This is an event record view, not a live process log.
      responses: {'200': {description: Session logs, content: {application/json: {schema: {$ref: '#/components/schemas/SessionLogs'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/tool-calls:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: session_id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, description: "Base64url-encoded offset into the matching tool/action records; malformed cursors return 400.", schema: {type: string}}
      - {name: limit, in: query, description: "Page size from 1 to 200; defaults to 50.", schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    get:
      operationId: listSessionToolCalls
      summary: List user-visible MCP tool and action records
      description: Scans workspace-run events and retains records whose type begins tool. or whose payload text contains a tool key. Tool is taken from payload when present, otherwise from the event type; tool/action/status are text-redacted. Pagination is an in-memory offset page over the filtered records and does not prove that an external tool process ran.
      responses: {'200': {description: Tool calls, content: {application/json: {schema: {$ref: '#/components/schemas/SessionToolCalls'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/claims:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listSessionClaims
      summary: List current and historical claims for the session agent
      responses: {'200': {description: Claims, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedClaims'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/proposals:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
    get:
      operationId: listSessionProposals
      summary: List proposal references for the session agent
      responses: {'200': {description: Proposals, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedSessionProposals'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/metrics:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getSessionMetrics
      summary: Get adapter-supplied usage metrics
      description: Reads the session metadata usage object and retains only values accepted by the safe-metric key/value filter. The source label is adapter_metadata; absent, malformed, or filtered metadata yields an empty usage object. These values are adapter-reported, not independently verified billing or runtime measurements.
      responses: {'200': {description: Session metrics, content: {application/json: {schema: {$ref: '#/components/schemas/SessionMetrics'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/sessions/{session_id}/environment:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: session_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getSessionEnvironment
      summary: Get safe environment fingerprint metadata
      description: Returns runtime Go version, operating system, architecture, and the session's stored adapter label. It does not expose shell variables, secrets, repository contents, or a full environment snapshot.
      responses: {'200': {description: Environment fingerprint, content: {application/json: {schema: {$ref: '#/components/schemas/SessionEnvironment'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listDeliberations
      summary: List workspace deliberations
      parameters: [{name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
      responses: {'200': {description: Deliberations, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberations'}}}}, '404': {$ref: '#/components/responses/Problem'}}
    post:
      operationId: createDeliberation
      summary: Create a governed deliberation
      parameters: [{$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliberationInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getDeliberation
      summary: Get a deliberation
      responses: {'200': {description: Deliberation, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/start:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: deliberation_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/ActorID'}, {$ref: '#/components/parameters/ActorRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: startDeliberation
      summary: Start a draft or resume a paused deliberation
      responses: {'200': {description: Updated deliberation, content: {application/json: {schema: {$ref: '#/components/schemas/Deliberation'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workspaces/{id}/deliberations/{deliberation_id}/pause:
