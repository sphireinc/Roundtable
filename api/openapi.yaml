    get:
      operationId: getConsensusAnalytics
      summary: Return bounded consensus analytics for a workspace
      description: Uses a half-open UTC time window [from,to), defaulting to the previous 24 hours through now and capped at 31 days. Proposal count filters proposal creation time; vote rates filter vote creation time; consensus and duration metrics include every snapshot in the window rather than only the latest snapshot per proposal. Success/rejection rates divide approved/blocked snapshot counts by all approved+blocked snapshots and are zero when that denominator is empty. Abstention rate uses abstain votes divided by all votes. Durations compare proposal creation with each approved/blocked snapshot and p50/p95 select the nearest rank. Quorum failures count pending snapshots. Human interventions count matching workspace audit actions. Current policy_override aggregation is not workspace-scoped and counts approved overrides across every workspace during the window; its query error is also ignored. This metric is therefore not safe for per-workspace attribution until implementation is corrected.
