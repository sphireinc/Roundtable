services:
  ui:
    build: {context: .}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8080/api/v1/events}
      NEXT_PUBLIC_WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-}
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev}
      NEXT_PUBLIC_ENABLE_DEV_MOCKS: ${NEXT_PUBLIC_ENABLE_DEV_MOCKS:-false}
    ports: ["3000:3000"]
